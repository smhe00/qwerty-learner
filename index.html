    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      ;(function (l) {
        var isGitHubPages = /(^|\.)github\.io$/i.test(l.hostname)
        // Only github.io serves the GitHub Pages /?/path redirect protocol.
        // EdgeOne deep links use edgeone.json SPA rewrites instead. An old
        // EdgeOne 404 may have produced /learn/?/&/~and~/...; strip this
        // synthetic query before the router boots, preserving the route.
        if (!isGitHubPages) {
          // Recover a known SPA deep link passed through the 404 fallback.
          // The marker exists only on the root document, is consumed once
          // before React mounts, and cannot redirect to another origin.
          var marker = '?qwerty-route='
          if (l.pathname === '/' && l.search.indexOf(marker) === 0) {
            var restored
            try {
              restored = decodeURIComponent(l.search.slice(marker.length))
            } catch (error) {
              restored = ''
            }
            if (/^\/(?:typing|learn|analysis|gallery|achievements|error-book|friend-links|mobile)(?:[?#]|$)/.test(restored)) {
              window.history.replaceState(window.history.state, null, restored)
            } else {
              window.history.replaceState(window.history.state, null, '/')
            }
            return
          }
          // Malformed GitHub Pages-style URLs from old EdgeOne 404 releases.
          if (l.search[1] === '/') {
            var cleanPath = l.pathname.replace(/\/+$/, '') || '/'
            window.history.replaceState(window.history.state, null, cleanPath + l.hash)
          }
          return
        }
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>

    <script>
      ;(() => {
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const storedDarkMode = localStorage.getItem('isOpenDarkModeAtom')
        let darkMode = systemDark

        if (storedDarkMode !== null) {
          try {
            darkMode = JSON.parse(storedDarkMode)
          } catch {
            darkMode = systemDark
          }
        }

        document.documentElement.classList.toggle('dark', darkMode)
      })()
    </script>
