name: S1 Workspace Browser Gate

on:
  push:
    branches:
      - product/main
    paths:
      - 'src/sync/workspace-*'
      - 'src/sync/auth.ts'
      - 'src/sync/manual-backup-v4.ts'
      - 'src/pages/Typing/components/Setting/DataSetting.tsx'
      - 'src/utils/db/data-export.ts'
      - 'tests/e2e/workspace-v4*'
      - 'tests/e2e/backup-harness.ts'
      - '.github/workflows/s1-workspace-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s1-workspace-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn playwright install --with-deps chromium
      - name: Run isolated local workspace browser tests
        run: yarn playwright test --config=tests/e2e/workspace-v4.config.ts
