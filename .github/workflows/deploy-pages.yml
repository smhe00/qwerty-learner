name: Deployment to GitHub Pages

on:
  push:
    branches:
      - product/main

# Latest main SHA must supersede older Pages builds or long explorer runs.
# Only the latest successfully published SHA can satisfy the etest gate.
concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  REACT_APP_DEPLOY_ENV: pages
  VITE_QWERTY_SYNC_DISABLED: 'true'

jobs:
  deploy:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [20.18.0]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Install Packages
        run: yarn install --frozen-lockfile
      - name: Build page
        run: yarn build
      - name: Stamp deployment source SHA
        run: printf '%s\n' "$GITHUB_SHA" > build/source-commit.txt
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
      - name: Wait for actual Pages deployment (exact artifact SHA)
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/wait-pages-deployment.mjs deployment
      - name: Wait for published source SHA propagation
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_SOURCE_SHA: ${{ github.sha }}
        run: node scripts/wait-pages-deployment.mjs propagation
      - name: Install Chromium for published browser regression
        run: npx playwright install --with-deps chromium
      - name: Check published SHA and main browser path
        env:
          PAGES_SOURCE_SHA: ${{ github.sha }}
        run: npx playwright test tests/e2e/pages-regression.spec.ts --project=chromium --retries=0
      - name: Upload redacted browser failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-published-regression-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
