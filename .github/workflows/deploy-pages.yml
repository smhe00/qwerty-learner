name: Deployment to GitHub Pages

on:
  push:
    branches:
      - product/main

concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

env:
  REACT_APP_DEPLOY_ENV: pages
  VITE_QWERTY_SYNC_DISABLED: 'true'

jobs:
  deploy:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [20.18.0]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      - name: Install Packages
        run: yarn install --frozen-lockfile
      - name: Build page
        run: yarn build
      - name: Stamp deployment source SHA
        run: printf '%s\n' "$GITHUB_SHA" > build/source-commit.txt
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
      - name: Install Chromium for published browser regression
        run: npx playwright install --with-deps chromium
      - name: Check published SHA and main browser path
        env:
          PAGES_SOURCE_SHA: ${{ github.sha }}
        run: npx playwright test tests/e2e/pages-regression.spec.ts --project=chromium --retries=0
      - name: Run seeded exploration (advisory, reproducible)
        id: explorer
        continue-on-error: true
        env:
          PAGES_SOURCE_SHA: ${{ github.sha }}
          EXPLORER_SEED: ${{ github.run_number }}
          EXPLORER_WORD_BUDGET: '8'
          EXPLORER_SEED_COUNT: '3'
        run: >
          npx playwright test
          tests/e2e/pages-explorer.spec.ts
          tests/e2e/pages-stateful-explorer.spec.ts
          tests/e2e/pages-explorer-v3.spec.ts
          --project=chromium --retries=0
      - name: Report advisory Explorer result separately
        if: always()
        env:
          EXPLORER_OUTCOME: ${{ steps.explorer.outcome }}
        run: |
          echo "Pages Explorer outcome: $EXPLORER_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EXPLORER_OUTCOME" != "success" ]; then
            echo "::warning::Pages Explorer failed (advisory); inspect its redacted trace artifact."
          fi
      - name: Upload redacted browser failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-published-regression-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
