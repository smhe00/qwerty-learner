name: Sync TLA Gate

on:
  push:
    branches:
      - product/main
    paths:
      - 'formal/sync/**'
      - 'docs/CLOUD_SYNC_V2_MODEL.md'
      - 'docs/SPECIFICATION_V1.md'
      - 'tests/verification/gate-manifest.json'
      - '.github/workflows/sync-tla-gate.yml'
  workflow_dispatch:

concurrency:
  group: sync-tla-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-tla:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download pinned TLA+ tools
        run: |
          curl --fail --location --silent --show-error             https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar             --output /tmp/tla2tools.jar
          actual="$(sha256sum /tmp/tla2tools.jar | awk '{print $1}')"
          expected='936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88'
          echo "Downloaded tla2tools.jar SHA256: $actual"
          if [ "$actual" != "$expected" ]; then
            echo "Pinned SHA256 mismatch."
            exit 1
          fi

      - name: Parse Cloud Sync V2 executable specification
        run: |
          java -cp /tmp/tla2tools.jar tla2sany.SANY             formal/sync/CloudSyncV2.tla

      - name: Exhaustively model-check bounded production protocol
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC             -workers auto             -config formal/sync/CloudSyncV2.production.cfg             formal/sync/CloudSyncV2.tla

      - name: Exhaustively model-check 3-device 4-username protocol
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC             -workers auto             -config formal/sync/CloudSyncV2.three-device-four-username.cfg             formal/sync/CloudSyncV2.tla

      - name: Require stale ordinary push counterexample
        run: |
          set +e
          java -cp /tmp/tla2tools.jar tlc2.TLC             -workers auto             -config formal/sync/CloudSyncV2.stale-push-mutation.cfg             formal/sync/CloudSyncV2.tla             > /tmp/sync-stale-push.log 2>&1
          status=$?
          set -e
          cat /tmp/sync-stale-push.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected stale-push mutation to violate OrdinaryWritesUseCurrentBase.'
            exit 1
          fi

      - name: Require immutable account-ID reuse counterexample
        run: |
          set +e
          java -cp /tmp/tla2tools.jar tlc2.TLC             -workers auto             -config formal/sync/CloudSyncV2.id-reuse-mutation.cfg             formal/sync/CloudSyncV2.tla             > /tmp/sync-id-reuse.log 2>&1
          status=$?
          set -e
          cat /tmp/sync-id-reuse.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected ID-reuse mutation to violate AccountIdNeverReused.'
            exit 1
          fi

      - name: Require active-Block retarget counterexample
        run: |
          set +e
          java -cp /tmp/tla2tools.jar tlc2.TLC             -workers auto             -config formal/sync/CloudSyncV2.block-retarget-mutation.cfg             formal/sync/CloudSyncV2.tla             > /tmp/sync-block-retarget.log 2>&1
          status=$?
          set -e
          cat /tmp/sync-block-retarget.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected block-retarget mutation to violate BlockSettingDoesNotRetargetCurrentBlock.'
            exit 1
          fi
