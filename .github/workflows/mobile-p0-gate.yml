name: Mobile P0 Gate

on:
  push:
    branches: [product/main]
    paths:
      - 'src/app.tsx'
      - 'index.html'
      - 'public/404.html'
      - 'scripts/emit-edgeone-spa-entries.mjs'
      - 'src/index.tsx'
      - 'src/sync/workspace-account-ui.ts'
      - 'src/sync/workspace-lock*.ts'
      - 'src/sync/workspace-bootstrap.ts'
      - 'src/sync/mobile-account*'
      - 'src/pages/Mobile/**'
      - 'src/pages/Learn/index.tsx'
      - 'src/pages/Typing/index.tsx'
      - 'src/pages/Typing/components/WordPanel/**'
      - 'src/review/**'
      - 'src/learn/**'
      - 'tests/learn/mobile-review-commit-contract.test.mjs'
      - 'tests/e2e/mobile-p0.*'
      - 'tests/e2e/mobile-learning-loop.spec.ts'
      - 'tests/e2e/mobile-account*'
      - 'tests/e2e/desktop-account*'
      - 'src/components/Header/index.tsx'
      - '.github/workflows/mobile-p0-gate.yml'
  workflow_dispatch:

concurrency:
  group: mobile-p0-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-p0:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Build production bundle
        run: yarn build
      - name: Audit scoped Mobile TypeScript
        shell: bash
        run: |
          set +e
          yarn tsc --noEmit > "$RUNNER_TEMP/mobile-tsc.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ] && grep -E '^src/(index[.]tsx|sync/(mobile-account-view|workspace-account-ui|workspace-lock|workspace-lock-diagnostics|workspace-bootstrap)[.]ts|app[.]tsx|pages/Mobile/|pages/Learn/index[.]tsx|pages/Typing/index[.]tsx|pages/Typing/components/WordPanel/)' "$RUNNER_TEMP/mobile-tsc.log"; then
            echo "::error::Mobile P0 TypeScript diagnostics"
            exit 1
          fi
      - name: Lint mobile learning surface and shared session adapter
        run: yarn eslint src/pages/Mobile src/pages/Learn/index.tsx src/pages/Typing/index.tsx src/pages/Typing/components/WordPanel/index.tsx src/pages/Typing/components/WordPanel/components/MobileWordPractice.tsx src/app.tsx src/index.tsx src/sync/workspace-account-ui.ts src/sync/mobile-account-view.ts src/sync/workspace-lock.ts src/sync/workspace-lock-diagnostics.ts src/sync/workspace-bootstrap.ts
      - name: Validate shared Learn review commit contract
        run: node --test tests/learn/mobile-review-commit-contract.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify keyboard-free mobile learning and persisted task evidence
        run: npx playwright test --config=tests/e2e/mobile-p0.config.ts --project=chromium --retries=0
      - name: Verify shared PC/phone login and isolated account transitions
        run: npx playwright test --config=tests/e2e/mobile-account.config.ts --project=chrome --retries=0
      - name: Build cloud-disabled Pages login preview
        env:
          REACT_APP_DEPLOY_ENV: pages
          VITE_QWERTY_SYNC_DISABLED: 'true'
        run: yarn build
      - name: Verify Pages login preview makes no cloud requests
        run: npx playwright test --config=tests/e2e/mobile-account-pages.config.ts --project=chrome --retries=0
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-p0-${{ github.run_id }}
          path: test-results/
          retention-days: 7
