name: Circle EdgeOne Read-Only Project Discovery

on:
  push:
    branches:
      - feature/circle-core-blob
    paths:
      - '.github/workflows/circle-edgeone-project-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-current-project:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - name: Install EdgeOne official Makers SDK (no postinstall scripts)
        run: npm install --no-save --ignore-scripts --prefix "$RUNNER_TEMP/circle-makers-sdk" @edgeone/makers-sdk
      - name: Read-only lookup of Qwerty Maker project ID
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/circle-makers-sdk"
          node --input-type=module <<'JS'
          import { Makers } from '@edgeone/makers-sdk'
          const token = process.env.EDGEONE_API_TOKEN
          if (!token) {
            console.log(JSON.stringify({ outcome: 'MISSING_EDGEONE_API_TOKEN' }))
            process.exit(0)
          }
          try {
            const makers = new Makers({ token })
            let seen = 0
            const matches = []
            for await (const item of makers.projects.listAll()) {
              seen++
              const name = String(item.name || '')
              if (!/qwerty|smhe/i.test(name)) continue
              let domain = ''
              try {
                domain = String((await makers.projects.get({
                  projectId: item.projectId,
                })).presetDomain || '')
              } catch { /* metadata may be unavailable */ }
              matches.push({
                projectId: item.projectId,
                projectName: name,
                matchesLiveDomain: /qwerty-plus\.edgeone\.dev/i.test(domain),
              })
            }
            console.log(JSON.stringify({
              check: 'circle_edgeone_project_discovery_readonly',
              outcome: matches.length ? 'MATCHED_PROJECTS' : 'NO_MATCHING_PROJECT',
              projectsExamined: seen, projects: matches,
              blobWritesAttempted: false, deploymentTriggered: false,
            }))
          } catch {
            // Do not log SDK errors, response payloads, URLs or token.
            console.log(JSON.stringify({
              check: 'circle_edgeone_project_discovery_readonly',
              outcome: 'PROJECT_LIST_FAILED',
              blobWritesAttempted: false, deploymentTriggered: false,
            }))
          }
          JS
