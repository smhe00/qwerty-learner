name: P4b EdgeOne Production Write-Gate Smoke

on:
  push:
    branches:
      - product/main
    paths:
      - 'tests/cloud/p4b-edgeone-gate-smoke.mjs'
      - '.github/workflows/p4b-edgeone-write-gate-smoke.yml'
  workflow_dispatch:

concurrency:
  group: p4b-edgeone-write-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - name: Check deployed EdgeOne fail-closed API and V1 compatibility
        id: smoke
        env:
          QWERTY_SYNC_BASE_URL: https://qwerty-plus.edgeone.dev/
        run: node tests/cloud/p4b-edgeone-gate-smoke.mjs
      - name: Persist production smoke outcome in commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ steps.smoke.outcome }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$RESULT" = 'success' ]; then
            STATE=success
            DESCRIPTION='Disposable EdgeOne V2 gate + V1 regression PASS'
          else
            STATE=failure
            DESCRIPTION='Disposable EdgeOne V2 gate smoke not passing'
          fi
          export STATE DESCRIPTION
          python3 - <<'PY' > /tmp/p4b-status.json
          import json, os
          print(json.dumps({
            'state': os.environ['STATE'],
            'context': 'p4b/edgeone-prod-write-gate',
            'description': os.environ['DESCRIPTION'],
            'target_url': 'https://github.com/' + os.environ['REPOSITORY'] +
                          '/actions/runs/' + os.environ['RUN_ID']
          }))
          PY
          curl --fail --silent --show-error --retry 2 -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/p4b-status.json \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${SHA}" > /dev/null
