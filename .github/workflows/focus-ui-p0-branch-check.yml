name: Focus UI P0 branch check

on:
  push:
    branches:
      - design/focus-ui-p0-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - name: Install pinned dependencies
        run: yarn install --frozen-lockfile
      - name: Lint UI components
        run: >
          yarn eslint
          src/components/Header/index.tsx
          src/components/ModeSwitcher/index.tsx
          src/components/NavigationOverlay.tsx
          src/pages/Typing/components/Speed/InfoBox.tsx
          src/pages/Typing/components/Speed/index.tsx
          src/pages/Learn/components/LearnLiveStats/index.tsx
          src/pages/Typing/components/WordPanel/index.tsx
          src/pages/Learn/components/LearnResultScreen.tsx
          src/components/InfoPanel/index.tsx
      - name: Build production bundle
        run: yarn build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare screenshots
        run: mkdir -p test-results/focus-ui
      - name: Focus screenshots and UI contracts
        run: >
          npx playwright test
          --config=tests/e2e/review-flow.config.ts
          --project=chrome
          tests/e2e/focus-ui.spec.ts
      - name: Existing navigation and mode regressions
        run: >
          npx playwright test
          --config=tests/e2e/review-flow.config.ts
          --project=chrome
          tests/e2e/default-learn-header.spec.ts
          tests/e2e/navigation-dialogs.spec.ts
      - name: Preserve reviewable screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focus-ui-p0-screenshots
          path: test-results/focus-ui/*.png
          retention-days: 10
          if-no-files-found: warn
