name: Mobile Menu Completion
on:
  push:
    branches: [feat/mobile-menu-completion-20261024]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-menu-completion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Scoped TypeScript audit
        shell: bash
        run: |
          set +e
          yarn tsc --noEmit > "$RUNNER_TEMP/mobile-menu-tsc.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            if ! grep -q 'error TS' "$RUNNER_TEMP/mobile-menu-tsc.log"; then
              cat "$RUNNER_TEMP/mobile-menu-tsc.log"
              exit 1
            fi
            if grep -E '^src/(app[.]tsx|pages/Mobile/|pages/Typing/components/WordPanel/components/MobileWordPractice[.]tsx|sync/CloudSyncSetting[.]tsx)' "$RUNNER_TEMP/mobile-menu-tsc.log"; then
              echo '::error::Mobile menu TypeScript diagnostics'
              exit 1
            fi
            echo 'Existing non-mobile TypeScript diagnostics are outside this scoped UI check.'
          fi
      - name: Scoped lint and production build
        run: |
          git diff --check
          yarn eslint src/pages/Mobile src/pages/Typing/components/WordPanel/components/MobileWordPractice.tsx src/sync/CloudSyncSetting.tsx src/app.tsx --ext .ts,.tsx
          yarn build
          test -f build/mobile/history/index.html
          test -f build/mobile/data/index.html
          test -f build/mobile/achievements/index.html
      - run: npx playwright install --with-deps chromium
      - name: Mobile functional acceptance
        run: npx playwright test --config=tests/e2e/mobile-menu-completion.config.ts
      - name: Retain synthetic screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-menu-evidence-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 5
