name: One-time etest custom-domain code migration
on:
  push:
    branches: [product/main]
    paths:
      - scripts/migrate-etest-host.mjs
      - .github/workflows/etest-domain-migration-once.yml

permissions:
  contents: write

concurrency:
  group: one-time-etest-domain-migration
  cancel-in-progress: false

jobs:
  safe-replace:
    if: github.ref_name == 'product/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - name: Replace only tracked active source and tests
        run: node scripts/migrate-etest-host.mjs
      - name: Validate patch shape and whitespace
        run: |
          git diff --check
          test -n "$(git diff --name-only)"
          git diff --stat
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Domain-specific and backend cloud regressions
        run: |
          node --test tests/cloud/etest-pilot-origin.test.mjs
          node --test tests/cloud/etest-pilot-origin.test.mjs tests/cloud/etest-pilot-origin.test.mjs
          yarn lint
          yarn build
      - name: Commit only after safety checks succeed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "fix(etest): migrate staging origin checks and live tests to t.smhe.cn"
          git push origin HEAD:product/main
