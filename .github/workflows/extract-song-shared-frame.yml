name: Extract Song Original Shared Frames
on:
  push:
    branches:
      - art/song-unified-14-baked-plaque-20261018
    paths:
      - 'scripts/art/extract-song-shared-frame.py'
      - '.github/workflows/extract-song-shared-frame.yml'
  workflow_dispatch:

permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install raster extract dependencies
        run: python -m pip install pillow numpy
      - name: Extract from original raw WebP
        run: python scripts/art/extract-song-shared-frame.py
      - name: Verify alpha, geometry and no frame inside picture
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          path=Path("public/assets/achievements/song/shared")
          for name in ["song_outer_border.png","song_empty_title_frame.png","song_frame_combined.png"]:
              im=Image.open(path/name)
              assert im.mode=="RGBA" and im.size==(960,1391), name
              assert im.getchannel("A").getextrema()==(0,255),name
              print(name, im.getbbox(), (path/name).stat().st_size)
          PY
      - name: Commit extracted transparent art to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/achievements/song/shared
          if ! git diff --cached --quiet; then
            git commit -m "art(song): add original shared transparent border and title layers"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: song-original-border-extraction
          path: public/assets/achievements/song/shared/
          retention-days: 14
