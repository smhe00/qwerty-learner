name: EdgeOne Production Promote

on:
  push:
    branches:
      - product/main
    paths:
      - '.github/workflows/edgeone-production-promote.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
      EDGEONE_PROJECT_ID: makers-cgemngjuuwle
      TARGET_SHA: 2e1128095c41afa4d881757eff037ff7a28f5294

    steps:
      - name: Checkout verified release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'

      - name: Verify EdgeOne credential
        shell: bash
        run: |
          test -n "$EDGEONE_API_TOKEN" || { echo "::error::EDGEONE_API_TOKEN is not configured"; exit 1; }
          test -n "$EDGEONE_PROJECT_ID" || { echo "::error::EDGEONE_PROJECT_ID is not configured"; exit 1; }

      - name: Resolve existing Makers project and validate CORS
        id: project
        shell: bash
        run: |
          npm install --no-save --ignore-scripts @edgeone/makers-sdk
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { Makers } from '@edgeone/makers-sdk'

          const makers = new Makers({
            token: process.env.EDGEONE_API_TOKEN,
            region: 'global',
          })

          const project = await makers.projects.get({
            projectId: process.env.EDGEONE_PROJECT_ID,
          })

          const envs = await makers.projects.listEnvs({
            projectId: process.env.EDGEONE_PROJECT_ID,
          })

          const cors = envs.find((item) => item.key === 'CORS_ORIGIN')?.value
          if (cors === '*') {
            throw new Error('Production CORS_ORIGIN must not be wildcard')
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${project.name}\n`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `domain=${project.presetDomain || ''}\n`)

          console.log('Resolved existing Makers project.')
          console.log('CORS policy:', cors || 'same-origin (runtime default)')
          NODE

      - name: Deploy verified product/main RC to Production
        shell: bash
        env:
          PROJECT_NAME: ${{ steps.project.outputs.name }}
        run: |
          npx --yes edgeone makers deploy -n "$PROJECT_NAME" -t "$EDGEONE_API_TOKEN" -e production

      - name: Verify production health
        shell: bash
        env:
          PRODUCTION_DOMAIN: ${{ steps.project.outputs.domain }}
        run: |
          if [ -z "$PRODUCTION_DOMAIN" ]; then
            echo "::warning::Makers project did not return presetDomain; deployment succeeded but automatic health check is unavailable."
            exit 0
          fi

          case "$PRODUCTION_DOMAIN" in
            http://*|https://*) BASE="$PRODUCTION_DOMAIN" ;;
            *) BASE="https://$PRODUCTION_DOMAIN" ;;
          esac

          for attempt in 1 2 3 4 5 6; do
            STATUS="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$BASE/api/health" || true)"
            if [ "$STATUS" = "200" ]; then
              node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/health.json','utf8')); if(!x.ok||x.service!=='qwerty-sync-gateway'||!Array.isArray(x.capabilities)||!x.capabilities.includes('application-auth-rate-limit-v2')) process.exit(1); console.log(JSON.stringify({ok:x.ok,service:x.service,apiVersion:x.apiVersion,authMode:x.authMode,capabilities:x.capabilities},null,2))"
              exit 0
            fi
            echo "Production health not ready yet (HTTP $STATUS), retrying..."
            sleep 10
          done

          echo "::error::Production /api/health did not become healthy"
          exit 1
