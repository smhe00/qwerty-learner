name: FSRS Phase G Gate

on:
  push:
    branches:
      - product/main
    paths:
      - '.github/workflows/fsrs-phase-g-gate.yml'
      - 'tests/fsrs/**'
      - 'tests/simulation/learner-simulator.ts'
      - 'docs/FSRS_PHASE_G.md'
      - 'src/review/fsrs/**'
      - 'src/review/types.ts'
      - 'src/review/scheduler.ts'
      - 'package.json'
      - 'yarn.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fsrs-phase-g-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-g:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      FSRS_PACKAGE_VERSION: 5.4.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: 'yarn'

      - name: Install project dependencies
        run: yarn install --frozen-lockfile

      - name: Verify pinned package version
        run: node tests/fsrs/verify-package-version.mjs "$FSRS_PACKAGE_VERSION"

      - name: Verify TypeScript 4.9 declaration compatibility
        run: >
          yarn tsc
          --noEmit
          --strict
          --skipLibCheck false
          --target ES2020
          --module ESNext
          --moduleResolution node
          --lib ES2020,DOM
          --types node
          tests/fsrs/g0-compat.ts
          tests/fsrs/shadow-replay.ts
          tests/fsrs/g1-shadow-replay.test.ts
          src/review/fsrs/analysis.ts
          src/review/fsrs/strategy.ts
          tests/fsrs/g3-analysis.test.ts

      - name: Bundle and run Node 20 compatibility probe
        run: |
          mkdir -p .fsrs-g0
          npx esbuild tests/fsrs/g0-compat.ts             --bundle             --platform=node             --target=node20             --format=esm             --outfile=.fsrs-g0/g0-compat.mjs
          node .fsrs-g0/g0-compat.mjs

      - name: Verify Vite 4 browser bundle
        run: >
          npx vite build tests/fsrs/browser
          --outDir ../../../.fsrs-g0/browser
          --emptyOutDir

      - name: Bundle G1 historical shadow replay tests
        run: |
          npx esbuild tests/fsrs/g1-shadow-replay.test.ts \
            --bundle \
            --platform=node \
            --target=node20 \
            --format=esm \
            --outfile=.fsrs-g0/g1-shadow-replay.test.mjs

      - name: Run G1 historical shadow replay tests
        run: node --test .fsrs-g0/g1-shadow-replay.test.mjs

      - name: Bundle G2 live shadow contract tests
        run: |
          npx esbuild tests/fsrs/g2-live-shadow.test.ts \
            --bundle \
            --platform=node \
            --target=node20 \
            --format=esm \
            --outfile=.fsrs-g0/g2-live-shadow.test.mjs

      - name: Run G2 live shadow contract tests
        run: node --test .fsrs-g0/g2-live-shadow.test.mjs

      - name: Bundle G3 analysis contract tests
        run: |
          npx esbuild tests/fsrs/g3-analysis.test.ts \
            --bundle \
            --platform=node \
            --target=node20 \
            --format=esm \
            --outfile=.fsrs-g0/g3-analysis.test.mjs

      - name: Run G3 analysis contract tests
        run: node --test .fsrs-g0/g3-analysis.test.mjs

      - name: Bundle G5 active scheduler contract
        run: |
          npx esbuild tests/fsrs/g5-active-scheduler.test.ts \
            --bundle \
            --platform=node \
            --target=node20 \
            --format=esm \
            --outfile=.fsrs-g0/g5-active-scheduler.test.mjs

      - name: Run G5 active scheduler contract
        run: node --test .fsrs-g0/g5-active-scheduler.test.mjs

      - name: Build Qwerty with pinned package present
        run: yarn build
