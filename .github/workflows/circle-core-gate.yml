name: Circle Core Gate (isolated feature branch)

on:
  push:
    branches:
      - feature/circle-core-blob
    paths:
      - 'cloud-functions/_shared/circle/**'
      - 'tests/cloud/circle*.mjs'
      - 'docs/CIRCLE_CORE_BLOB_V1.md'
      - 'scripts/circle-blob-live-contract.mjs'
      - '.github/workflows/circle-core-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: circle-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  circle-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Run Circle kernel and concurrency tests
        run: node --test tests/cloud/circle-core.test.mjs tests/cloud/circle-trusted-access.test.mjs tests/cloud/circle-eventual-access.test.mjs
      - name: Static-check live probe (never execute with production credentials)
        run: node --check scripts/circle-blob-live-contract.mjs
      - name: Lint Circle-only backend and tests
        run: yarn eslint cloud-functions/_shared/circle tests/cloud/circle-core.test.mjs tests/cloud/circle-trusted-access.test.mjs tests/cloud/circle-eventual-access.test.mjs tests/cloud/circle-core-cas.historical.mjs --ext .js,.mjs
      - name: Lint ES module sandbox probe
        run: yarn eslint scripts/circle-blob-live-contract.mjs --parser-options '{"sourceType":"module","ecmaVersion":2022}'
      - name: Verify no frontend changed in branch
        env:
          BASE: ${{ github.event.before }}
        run: |
          if git rev-parse --verify "${BASE}^{commit}" >/dev/null 2>&1; then
            git diff --name-only "${BASE}" HEAD | grep -E '^src/|^public/' && exit 1 || true
          fi
