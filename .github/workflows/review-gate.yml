name: Review Gate

on:
  push:
    branches:
      - product/main
    paths:
      - 'src/review/**'
      - 'src/learn/**'
      - 'src/dev/**'
      - 'src/components/ModeSwitcher/**'
      - 'src/components/Footer/**'
      - 'src/pages/Learn/**'
      - 'src/pages/Analysis/**'
      - 'src/index.tsx'
      - 'src/pages/Typing/index.tsx'
      - 'src/pages/Typing/store/**'
      - 'src/pages/Typing/components/ResultScreen/**'
      - 'src/utils/wordListFetcher.ts'
      - 'src/pages/Typing/hooks/useWordList.ts'
      - 'src/utils/chapter.ts'
      - 'src/resources/defaultDictionary.ts'
      - 'src/resources/dictionary.ts'
      - 'public/dicts/hujiaoxin2027.json'
      - 'src/pages/Typing/components/StartButton/**'
      - 'src/utils/db/record.ts'
      - 'src/utils/db/index.ts'
      - 'src/utils/db/review-record.ts'
      - 'src/achievement/**'
      - 'src/utils/db/data-export.ts'
      - 'src/utils/backup.ts'
      - 'src/pages/Gallery-N/ReviewDetail/**'
      - 'src/pages/Gallery-N/index.tsx'
      - 'src/pages/Gallery-N/DictionaryWithoutCover.tsx'
      - 'src/pages/Typing/components/WordPanel/**'
      - 'src/pages/Typing/components/Setting/**'
      - 'src/store/reviewInfoAtom.ts'
      - 'src/store/index.ts'
      - 'src/resources/soundResource.ts'
      - 'src/hooks/useKeySounds.ts'
      - 'tests/audio/**'
      - 'tests/resources/**'
      - 'tests/e2e/learn-audio-regression.spec.ts'
      - 'tests/e2e/learn-audio-regression.config.ts'
      - 'tests/e2e/review.spec.ts'
      - 'tests/e2e/review-flow.spec.ts'
      - 'tests/e2e/backup-harness.html'
      - 'tests/e2e/backup-harness.ts'
      - 'tests/e2e/review-flow.config.ts'
      - 'tests/e2e/typing-lifecycle.config.ts'
      - 'tests/e2e/typing-lifecycle.spec.ts'
      - 'tests/e2e/browser-stateful-fuzz.spec.ts'
      - 'tests/e2e/browser-stateful-fuzz-core.ts'
      - 'tests/e2e/browser-stateful-fuzz.config.ts'
      - 'tests/e2e/production-smoke.spec.ts'
      - 'tests/e2e/production-smoke.config.ts'
      - 'tests/e2e/pages-smoke.spec.ts'
      - 'tests/e2e/pages-smoke.config.ts'
      - 'tests/review/**'
      - 'tests/simulation/**'
      - 'tests/formal/**'
      - 'formal/**'
      - 'tests/fsrs/**'
      - 'docs/REVIEW_*.md'
      - 'docs/LEARN_*.md'
      - '.github/workflows/review-gate.yml'
      - 'package.json'
      - 'yarn.lock'
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint Review code
        run: >
          yarn eslint
          src/review
          src/learn
          src/dev
          src/components/ModeSwitcher
          src/pages/Learn
          src/pages/Analysis
          src/index.tsx
          src/pages/Typing/index.tsx
          src/pages/Typing/store
          src/pages/Typing/components/ResultScreen
          src/utils/wordListFetcher.ts
          src/pages/Typing/hooks/useWordList.ts
          src/utils/chapter.ts
          src/pages/Typing/components/StartButton
          src/utils/db/record.ts
          src/utils/db/index.ts
          src/utils/db/review-record.ts
          src/achievement
          src/utils/db/data-export.ts
          src/utils/backup.ts
          src/pages/Gallery-N/ReviewDetail
          src/pages/Gallery-N/index.tsx
          src/pages/Gallery-N/DictionaryWithoutCover.tsx
          src/pages/Typing/components/WordPanel
          src/pages/Typing/components/Setting
          src/store/index.ts
          --ext .ts,.tsx

      - name: Bundle Review verification tests
        run: |
          mkdir -p .review-test
          npx esbuild \
            tests/review/domain.test.ts \
            tests/review/acquisition-regression.test.ts \
            tests/review/formal-model.test.ts \
            tests/review/control-stability.test.ts \
            tests/review/async-ownership.test.ts \
            tests/review/typing-audio-formal.test.ts \
            --bundle \
            --platform=node \
            --target=node20 \
            --format=esm \
            --outdir=.review-test \
            --out-extension:.js=.mjs

      - name: Run Review domain tests
        run: node --test .review-test/domain.test.mjs

      - name: Run Acquisition backup regression
        run: node --test .review-test/acquisition-regression.test.mjs

      - name: Run Review formal model checker
        run: node --test .review-test/formal-model.test.mjs

      - name: Bundle TLA trace bridge tests
        run: |
          npx esbuild tests/formal/tla-trace-bridge.test.ts \
            --bundle \
            --platform=node \
            --target=node20 \
            --format=esm \
            --outfile=.review-test/tla-trace-bridge.test.mjs

      - name: Run TLA trace bridge tests
        run: node --test .review-test/tla-trace-bridge.test.mjs

      - name: Bundle and smoke diagnostic replay CLI
        run: |
          npx esbuild src/dev/replay-cli.ts \
            --bundle \
            --platform=node \
            --target=node20 \
            --format=esm \
            --outfile=.review-test/replay-incident.mjs
          printf '%s\n' '{"schema":"qwerty-developer-trace-v1","exportedAt":0,"events":[]}' > .review-test/healthy-trace.json
          node .review-test/replay-incident.mjs .review-test/healthy-trace.json

      - name: Run Learn control stability gate
        run: node --test .review-test/control-stability.test.mjs

      - name: Run Learn async ownership race gate
        run: node --test .review-test/async-ownership.test.mjs

      - name: Bundle longitudinal learner simulation
        run: |
          npx esbuild tests/simulation/learner-simulator.test.ts tests/simulation/policy-sweep.test.ts tests/simulation/trace-signature.test.ts tests/simulation/calibration-report.test.ts tests/simulation/system-oracle.test.ts tests/simulation/interaction-driver.test.ts tests/simulation/checkpoint-driver.test.ts tests/simulation/mutation-scorecard.test.ts tests/simulation/system-driver.test.ts tests/simulation/system-explorer.test.ts tests/simulation/persistence-race.test.ts tests/simulation/field-replay.test.ts --bundle --platform=node --target=node20 --format=esm --outdir=.review-test --out-extension:.js=.mjs

      - name: Run longitudinal learner simulation
        run: |
          node --test .review-test/learner-simulator.test.mjs
          node --test .review-test/policy-sweep.test.mjs
          node --test .review-test/trace-signature.test.mjs
          node --test .review-test/calibration-report.test.mjs
          node --test .review-test/system-oracle.test.mjs
          node --test .review-test/interaction-driver.test.mjs
          node --test .review-test/checkpoint-driver.test.mjs
          node --test .review-test/mutation-scorecard.test.mjs
          node --test .review-test/system-driver.test.mjs
          node --test .review-test/system-explorer.test.mjs
          node --test .review-test/persistence-race.test.mjs
          node --test .review-test/field-replay.test.mjs

      - name: Run Typing audio lifecycle formal model
        run: node --test .review-test/typing-audio-formal.test.mjs

      - name: Bundle FSRS shadow contract tests
        run: |
          npx esbuild tests/fsrs/g2-live-shadow.test.ts \
            --bundle \
            --platform=node \
            --target=node20 \
            --format=esm \
            --outfile=.review-test/g2-live-shadow.test.mjs

      - name: Run FSRS shadow contract tests
        run: node --test .review-test/g2-live-shadow.test.mjs

      - name: Bundle FSRS G3 analysis tests
        run: |
          npx esbuild tests/fsrs/g3-analysis.test.ts \
            --bundle \
            --platform=node \
            --target=node20 \
            --format=esm \
            --outfile=.review-test/g3-analysis.test.mjs

      - name: Run FSRS G3 analysis tests
        run: node --test .review-test/g3-analysis.test.mjs

      - name: Run sound URL resolution guard
        run: node --test tests/audio/sound-url.test.mjs

      - name: Run dictionary URL resolution guard
        run: node --test tests/resources/dictionary-url.test.mjs

      - name: Run Typing lifecycle browser gate
        run: npx playwright test --config=tests/e2e/typing-lifecycle.config.ts --project=chrome

      - name: Run Learn audio regression browser gate
        run: npx playwright test --config=tests/e2e/learn-audio-regression.config.ts --project=chrome

      - name: Run P3 browser stateful fuzz gate
        env:
          P3_FUZZ_SEEDS: '20'
          P3_FUZZ_STEPS: '5'
        run: npx playwright test --config=tests/e2e/browser-stateful-fuzz.config.ts --project=chrome

      # Build/smoke precede the historically slower Review-flow browser suite
      # so a fixture timeout cannot hide compile or production-navigation
      # regressions. The Review browser gate still runs and still gates the job.
      - name: Build Qwerty
        run: yarn build

      - name: Run production navigation smoke
        run: npx playwright test --config=tests/e2e/production-smoke.config.ts --project=chrome

      - name: Build GitHub Pages variant
        env:
          REACT_APP_DEPLOY_ENV: pages
        run: yarn build

      - name: Run GitHub Pages basename smoke
        run: npx playwright test --config=tests/e2e/pages-smoke.config.ts --project=chrome

      - name: Run multi-word Review browser gate
        run: npx playwright test --config=tests/e2e/review-flow.config.ts --project=chrome
