name: Handoff merge-tree diagnostic
on:
  push:
    branches: [fix/session-handoff-20261025]
    paths: ['.github/workflows/session-handoff-merge-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect exact native Git inputs and unresolved paths only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/handoff-merge-diagnostic"
          git fetch --no-tags origin refs/heads/product/main:refs/remotes/origin/product/main
          git rev-parse HEAD origin/product/main | tee "$RUNNER_TEMP/handoff-merge-diagnostic/inputs.txt"
          for ref in HEAD origin/product/main; do
            echo "SOURCE $ref"
            git ls-tree -r "$ref" -- tests/cloud/session-handoff-scope.test.mjs tests/cloud/idle-build-env.test.mjs .github/workflows/idle-staging-trigger-qualification.yml .github/workflows/perf-p0-p1-branch-gate.yml package.json
          done
          set +e
          git merge-tree --write-tree HEAD origin/product/main > "$RUNNER_TEMP/handoff-merge-diagnostic/merge-tree.txt"
          result=$?
          set -e
          cat "$RUNNER_TEMP/handoff-merge-diagnostic/merge-tree.txt"
          if [ "$result" = 0 ]; then
            tree=$(head -n1 "$RUNNER_TEMP/handoff-merge-diagnostic/merge-tree.txt")
            git ls-tree -r "$tree" -- tests/cloud/session-handoff-scope.test.mjs
            git archive --format=tar.gz -o "$RUNNER_TEMP/handoff-merge-diagnostic/merged-tracked-source.tar.gz" "$tree" cloud-functions tests/cloud scripts package.json .github
          fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handoff-merge-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/handoff-merge-diagnostic/
          retention-days: 3
          if-no-files-found: error
