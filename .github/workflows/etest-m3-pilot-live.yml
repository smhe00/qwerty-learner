name: etest M1+M3 Real Multi-Device Pilot
on:
  push:
    branches: [edgeone-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-multi-device:
    if: github.ref_name == 'edgeone-test'
    runs-on: ubuntu-22.04
    timeout-minutes: 19
    env:
      QWERTY_SYNC_BASE_URL: https://etest.edgeone.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - name: Pin actual etest static source
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EDGEONE_WAIT_MS: '600000'
        run: node scripts/verify-edgeone-source.mjs
      - name: Require branch-matched backend M1+M3 pilot before account creation
        run: node tests/cloud/etest-m1m3-pilot-preflight.mjs
      - name: Two independent logins and exact immutable Blob receipts
        run: node tests/cloud/etest-multi-device-pilot.mjs
