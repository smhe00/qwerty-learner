name: Circle KV Capability Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kv-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - name: Probe EdgeOne KV API capabilities
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_ID: makers-yggquqwubqul
        run: |
          node --input-type=module <<'JS'
          const report = {
            check: 'circle_kv_capability_probe_v2',
            writesAttempted: false,
            results: {}
          }

          try {
            const pkg = await import('@edgeone/makers-sdk')
            report.results.sdkLoaded = true
            report.results.exports = Object.keys(pkg)

            for (const key of Object.keys(pkg)) {
              if (/kv|store|edge|blob/i.test(key)) {
                report.results.candidateExports ??= []
                report.results.candidateExports.push(key)
              }
            }
          } catch (e) {
            report.results.sdkLoaded = false
            report.results.error = String(e.message)
          }

          console.log(JSON.stringify(report, null, 2))
          JS
