name: Session handoff qualification
on:
  push:
    branches: ['fix/session-handoff-20261025']
    paths:
      - 'cloud-functions/**'
      - 'tests/cloud/session-handoff-*'
      - 'experimental/session-handoff/**'
      - '.github/workflows/session-handoff-prototype.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: session-handoff-feature-qualification
  cancel-in-progress: false
jobs:
  protocol-and-gateway:
    if: github.ref == 'refs/heads/fix/session-handoff-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/session-handoff-20261025
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply pinned auth-body fix and integrate upstream without overwriting it
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin product/main fix/session-handoff-20261025
          git merge --ff-only origin/fix/session-handoff-20261025
          grep -Fq 'return withHandoffGateway(context, onUncoordinatedRequest)' 'cloud-functions/api/[[default]].js'
          PATCH=experimental/session-handoff/auth-body.patch
          if git apply --reverse --check "$PATCH"; then
            echo 'Auth body receive-once fix is already applied'
          else
            test "$(git hash-object cloud-functions/_shared/session-handoff-gateway.js)" = efb5614a91dbcb0dc85250ce96e40d99f429f601
            test "$(git hash-object 'cloud-functions/api/[[default]].js')" = 233a8a31421496df4ad1ab61a45b315578800b46
            test "$(git hash-object tests/cloud/session-handoff-gateway.test.mjs)" = 2881ee2b33871ee4bc05d39e911a65732ac09393
            test "$(git hash-object tests/cloud/session-handoff-live.mjs)" = da3a6f18b6bdc6faddcd467fb1b71d74ccb63515
            git apply --check "$PATCH"
            git apply "$PATCH"
            git diff --check
            git add cloud-functions/_shared/session-handoff-auth-body.js cloud-functions/_shared/session-handoff-gateway.js 'cloud-functions/api/[[default]].js' tests/cloud/session-handoff-gateway.test.mjs tests/cloud/session-handoff-live.mjs
            git commit -m 'fix(auth): receive handoff auth body once without runtime clone'
          fi
          git merge --no-edit origin/product/main
          git rev-parse HEAD > "$RUNNER_TEMP/handoff-tested-sha.txt"
      - name: Isolated test bundler only; no database or application dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/handoff-test-deps" --ignore-scripts --no-audit --no-fund esbuild@0.17.19
          ln -s "$RUNNER_TEMP/handoff-test-deps/node_modules" node_modules
      - name: Protocol, actual HTTP gateway, multi-process and finite interleaving tests
        run: |
          set -euo pipefail
          node --test tests/cloud/session-handoff-service.test.mjs tests/cloud/session-handoff-barrier.test.mjs tests/cloud/session-handoff-core.test.mjs tests/cloud/session-handoff-blob.test.mjs tests/cloud/session-handoff-gateway.test.mjs tests/cloud/session-handoff-process.test.mjs tests/cloud/session-handoff-model.test.mjs tests/cloud/backend-core.test.mjs tests/cloud/edgeone-blob-storage.test.mjs tests/cloud/workspace-transition.test.mjs | tee "$RUNNER_TEMP/handoff-qualification.tap"
      - name: Publish only the validated feature branch, never staging or production
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = fix/session-handoff-20261025
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/handoff-tested-sha.txt")"
          git diff --exit-code
          git diff --cached --exit-code
          git push origin HEAD:refs/heads/fix/session-handoff-20261025
          echo "Tested feature SHA: $(cat "$RUNNER_TEMP/handoff-tested-sha.txt")" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain exact test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handoff-qualification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/handoff-tested-sha.txt
            ${{ runner.temp }}/handoff-qualification.tap
          if-no-files-found: warn
          retention-days: 7
