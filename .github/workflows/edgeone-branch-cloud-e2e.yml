name: Branch EdgeOne Cloud E2E

# product/main clouds run ONLY against q-test EdgeOne, never Pages.
# After an explicit master release, repeat the same tests on production EdgeOne.
on:
  push:
    branches: [product/main, master]
    paths:
      - 'src/sync/**'
      - 'cloud-functions/**'
      - '.env.production'
      - '.github/workflows/edgeone-branch-cloud-e2e.yml'
      - 'tests/e2e/edgeone-s1-cloud-accounts.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeone-branch-cloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-browser-cloud:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      QWERTY_SYNC_BASE_URL: ${{ github.ref_name == 'master' && 'https://qwerty-plus.edgeone.dev/' || 'https://q-test.edgeone.cool/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - name: Wait for branch-matched EdgeOne backend capability
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const expected = process.env.GITHUB_REF_NAME === 'master'
            ? 'https://qwerty-plus.edgeone.dev/' : 'https://q-test.edgeone.cool/'
          const actual = new URL(process.env.QWERTY_SYNC_BASE_URL)
          if (actual.origin !== new URL(expected).origin) throw Error('Wrong EdgeOne test origin')
          let healthy = false
          for (let index = 0; index < 42; index++) {
            try {
              const result = await fetch(new URL('/api/health', expected), {
                cache: 'no-store', signal: AbortSignal.timeout(10000),
              })
              const health = await result.json()
              if (result.ok && health.service === 'qwerty-sync-gateway' &&
                  health.capabilities?.includes('edgeone-same-origin-e2e-v1')) {
                healthy = true
                console.log('Matching Maker gateway found, auth mode:', health.authMode)
                break
              }
            } catch { /* Not yet visible in this POP */ }
            await new Promise(resolve => setTimeout(resolve, 10000))
          }
          if (!healthy) throw Error('Branch EdgeOne deployment not verified; no accounts created')
          NODE
      - name: Create disposable account identifiers for independent browser profiles
        shell: bash
        run: |
          echo "QWERTY_E2E_USERNAME=e2e_mc_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_a" >> "$GITHUB_ENV"
          echo "QWERTY_E2E_USERNAME_B=e2e_mc_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_b" >> "$GITHUB_ENV"
          password="E2E-$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "QWERTY_E2E_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Install browser tests
        run: |
          yarn install --frozen-lockfile
          npx playwright install --with-deps chromium
      - name: Real EdgeOne S1 account login across three isolated Chromium profiles
        run: npx playwright test --config=tests/e2e/edgeone-s1-cloud-accounts.config.ts
      - name: Remove disposable cloud accounts, even on test failure
        if: always() && env.QWERTY_E2E_USERNAME != ''
        run: node tests/cloud/cleanup-production-multi-client.mjs
      - name: Retain redacted failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edgeone-cloud-e2e-${{ github.run_id }}
          path: test-results/**/*-redacted-trace.json
          if-no-files-found: ignore
          retention-days: 7

  real-v4-transport:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      QWERTY_SYNC_BASE_URL: ${{ github.ref_name == 'master' && 'https://qwerty-plus.edgeone.dev/' || 'https://q-test.edgeone.cool/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - name: Verify branch-to-EdgeOne target before creating any accounts
        run: |
          node --input-type=module <<'NODE'
          const expected = process.env.GITHUB_REF_NAME === 'master'
            ? 'https://qwerty-plus.edgeone.dev' : 'https://q-test.edgeone.cool'
          if (new URL(process.env.QWERTY_SYNC_BASE_URL).origin !== expected)
            throw Error('Cloud E2E must use branch-matched EdgeOne, never Pages')
          const r = await fetch(expected + '/api/health', {
            signal: AbortSignal.timeout(15000),
          })
          const health = await r.json()
          if (!r.ok || health.service !== 'qwerty-sync-gateway' ||
              !health.capabilities?.includes('edgeone-same-origin-e2e-v1'))
            throw Error('Matching EdgeOne V4 gateway not deployed')
          NODE
      - name: Verify real V4 upload, readback, stale conflict and Blob size
        run: node tests/cloud/p4b-edgeone-gate-smoke.mjs
