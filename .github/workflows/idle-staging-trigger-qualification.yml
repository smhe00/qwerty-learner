name: Idle cleanup actual staging trigger qualification
on:
  push:
    branches: [product/main]
    paths:
      - '.github/workflows/idle-staging-trigger-qualification.yml'
      - 'scripts/idle-staging-environment.mjs'
      - 'scripts/idle-china-control-plane.mjs'
      - 'scripts/idle-staging-trigger-qualification.mjs'
      - 'tests/cloud/idle-staging-environment.test.mjs'
      - 'interactive/reports/IDLE-ACCOUNT-ACTIVATION-20261025-report.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reversible-staging-idle-runtime
  cancel-in-progress: false
jobs:
  staging-trigger:
    if: github.ref_name == 'product/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[idle-live-qualification]'))
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      IDLE_MAKERS_SDK_DIR: /tmp/idle-makers-sdk
      IDLE_STAGING_OUTPUT: /tmp/idle-staging-trigger
      IDLE_STAGING_ACK: RUN_REVERSIBLE_STAGING_IDLE_TRIGGER
      IDLE_STAGING_EXPECTED_SHA: ${{ github.sha }}
      IDLE_QUALIFICATION_PROJECT_VERIFIED: EXACT_ETEST_DOMAIN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Qualify exact-setting rollback and production refusal before credential use
        run: node --test tests/cloud/idle-staging-environment.test.mjs tests/cloud/idle-china-control-plane.test.mjs
      - name: Install official control-plane SDK without lifecycle scripts
        run: npm install --no-save --ignore-scripts --prefix "$IDLE_MAKERS_SDK_DIR" @edgeone/makers-sdk@0.1.0
      - run: npx playwright install --with-deps chromium
      - name: Read-only exact staging discovery
        id: discover
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_CHINA_API_TOKEN }}
          IDLE_DISCOVERY_REPORT: ${{ runner.temp }}/idle-staging-trigger-discovery.json
        run: node scripts/idle-qualification-discovery.mjs
      - name: Pin the actual staging branch before changing settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          assert re.fullmatch(r'[\w.-]+/[\w.-]+', repo)
          sha = subprocess.check_output(['gh', 'api', 'repos/' + repo + '/git/ref/heads/edgeone-test', '--jq', '.object.sha'], text=True).strip()
          assert re.fullmatch(r'[a-f0-9]{40}', sha)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('IDLE_STAGING_BASE_SHA=' + sha + '\n')
          print('Pinned current staging branch for pre-write source validation')
          PY
      - name: Snapshot only the two nonsecret staging idle settings before changes
        id: snapshot
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_CHINA_API_TOKEN }}
          IDLE_QUALIFICATION_PROJECT_ID: ${{ steps.discover.outputs.project_id }}
        run: node scripts/idle-staging-trigger-qualification.mjs snapshot
      - name: Preserve nonsecret rollback snapshot before any configuration write
        uses: actions/upload-artifact@v4
        with:
          name: idle-staging-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.IDLE_STAGING_OUTPUT }}/rollback-settings.json
          if-no-files-found: error
          retention-days: 7
      - name: Apply temporary staging settings before coordinated deployment
        id: apply
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_CHINA_API_TOKEN }}
          IDLE_QUALIFICATION_PROJECT_ID: ${{ steps.discover.outputs.project_id }}
        run: node scripts/idle-staging-trigger-qualification.mjs apply
      - name: Await staging deployment, verify the real browser trigger, restore settings
        id: journey
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_CHINA_API_TOKEN }}
          IDLE_QUALIFICATION_PROJECT_ID: ${{ steps.discover.outputs.project_id }}
        run: node scripts/idle-staging-trigger-qualification.mjs run
      - name: Independently restore control-plane settings even after a failed test
        id: restore
        if: always() && steps.snapshot.outcome == 'success'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_CHINA_API_TOKEN }}
          IDLE_QUALIFICATION_PROJECT_ID: ${{ steps.discover.outputs.project_id }}
        run: node scripts/idle-staging-trigger-qualification.mjs restore
      - name: Preserve browser result and rollback result before runtime confirmation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idle-staging-trigger-intermediate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.IDLE_STAGING_OUTPUT }}/run-result.json
            ${{ env.IDLE_STAGING_OUTPUT }}/restore-result.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Await restored deployment and verify execution disabled through the real API
        if: always() && steps.restore.outcome == 'success'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_CHINA_API_TOKEN }}
          IDLE_QUALIFICATION_PROJECT_ID: ${{ steps.discover.outputs.project_id }}
          IDLE_STAGE_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/idle-staging-trigger-qualification.mjs confirm
      - name: Retain fixed-phase verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idle-staging-trigger-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.IDLE_STAGING_OUTPUT }}/*result.json
            ${{ runner.temp }}/idle-staging-trigger-discovery.json
          if-no-files-found: ignore
          retention-days: 7
