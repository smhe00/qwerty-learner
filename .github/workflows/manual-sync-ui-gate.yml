name: Manual Sync UI scoped gate

on:
  push:
    branches: [feat/manual-sync-entry-20261026]
    paths:
      - 'src/**'
      - 'tests/cloud/quick-sync-entry.test.mjs'
      - '.github/workflows/manual-sync-ui-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Guarded quick-entry intent and outcome classification
        run: node --test tests/cloud/quick-sync-entry.test.mjs
      - name: Lint only the touched UI and guarded entry modules
        run: >
          yarn eslint
          src/sync/quick-sync-entry.ts src/components/QuickSyncAction.tsx
          src/components/QuickSyncNotice.tsx src/components/Header/index.tsx
          src/pages/Mobile/index.tsx src/pages/Typing/index.tsx
          src/pages/Learn/index.tsx src/index.tsx src/app.tsx
      - name: Build actual UI bundle (no cloud deployment)
        run: yarn build
      - name: Check TypeScript diagnostics in newly authored entry files
        shell: bash
        run: |
          set +e
          yarn tsc --noEmit --pretty false > "$RUNNER_TEMP/quick-tsc.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            if grep -E '^src/(sync/quick-sync-entry[.]ts|components/QuickSync(Action|Notice)[.]tsx|components/Header/index[.]tsx|index[.]tsx|app[.]tsx|pages/Mobile/index[.]tsx|pages/Learn/index[.]tsx|pages/Typing/index[.]tsx)' "$RUNNER_TEMP/quick-tsc.log"; then
              echo "::error::New or touched manual-Sync entry has TypeScript diagnostics"
              exit 1
            fi
            echo "::warning::Unrelated TypeScript baseline errors remain"
          fi
      - name: Verify no automatic-release target changed
        run: |
          test "$GITHUB_REF_NAME" = feat/manual-sync-entry-20261026
          git diff --check
