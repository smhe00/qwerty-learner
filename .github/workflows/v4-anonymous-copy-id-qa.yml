name: V4 Import Anonymous Destination Copy QA (No Maker)

on:
  push:
    branches: [fix/v4-anonymous-copy-id-20261015]

permissions:
  contents: read

jobs:
  anonymous-copy-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Lint modified V4 import UI and tests
        run: yarn eslint src/sync/manual-v4-import-ui.ts
      - name: Production build
        run: yarn build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Clipboard and cross-account V4 import UI E2E
        run: npx playwright test tests/e2e/workspace-v4-import-copy-id.spec.ts tests/e2e/workspace-v4-manual-import.spec.ts --config=tests/e2e/workspace-v4.config.ts --project=chromium --workers=1 --retries=0 --reporter=list
