name: Cloud Sync Gate

on:
  push:
    branches:
      - product/main
    paths:
      - 'cloud-functions/**'
      - 'tests/cloud/**'
      - 'tests/e2e/etest-three-device-auto-fork.*'
      - 'tests/e2e/etest-login-v4-history.*'
      - 'tests/e2e/edgeone-s1-cloud-accounts.*'
      - 'tests/e2e/workspace-v4-app.spec.ts'
      - 'tests/e2e/workspace-v4-session-revoked.spec.ts'
      - 'tests/e2e/workspace-v4-s2-multi-device.spec.ts'
      - 'tests/e2e/pages-regression.spec.ts'
      - '.github/workflows/etest-three-device-auto-fork.yml'
      - 'src/sync/**'
      - 'src/index.tsx'
      - 'src/utils/db/record.ts'
      - 'src/utils/backup.ts'
      - 'src/utils/db/index.ts'
      - 'src/utils/db/data-export.ts'
      - 'src/achievement/**'
      - 'src/pages/Typing/components/Setting/DataSetting.tsx'
      - 'docs/CLOUD_SYNC_*.md'
      - 'edgeone.json'
      - 'index.html'
      - 'public/404.html'
      - 'scripts/emit-edgeone-spa-entries.mjs'
      - '.env.example'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/cloud-sync.yml'
      - '.github/workflows/etest-m3-pilot-live.yml'
      - '.github/workflows/etest-three-device-auto-fork.yml'
      - '.github/workflows/edgeone-branch-cloud-e2e.yml'
      - 'scripts/release-readiness.mjs'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/pages-explorer.yml'
      - '.github/workflows/etest-entry-gate.yml'
      - 'scripts/verify-etest-entry.mjs'
      - 'scripts/wait-pages-deployment.mjs'
      - 'scripts/probe-etest-blob-single-object.mjs'
      - 'scripts/benchmark-master-etest-v4.mjs'
      - '.github/workflows/benchmark-master-etest-v4.yml'
      - '.github/workflows/etest-blob-single-object-limit.yml'
  workflow_dispatch:

concurrency:
  group: cloud-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-backend:
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run cloud backend contract tests
        run: yarn test:cloud

      - name: Verify staging E2E scenario syntax without network or accounts
        run: |
          node --check tests/cloud/etest-safe-v4-merge-writeback.mjs
          node --check tests/cloud/etest-m1m3-pilot-preflight.mjs
          node --check tests/cloud/etest-multi-device-pilot.mjs
          node --check scripts/release-readiness.mjs
          npx playwright test --list --config=tests/e2e/etest-three-device-auto-fork.config.ts
          npx playwright test --list --config=tests/e2e/edgeone-s1-cloud-accounts.config.ts
      - name: Lint cloud sync code
        run: yarn eslint cloud-functions tests/cloud --ext .js,.mjs

      - name: Lint frontend sync code
        run: >
          yarn eslint
          src/sync
          src/utils/backup.ts
          src/utils/db/index.ts
          src/utils/db/data-export.ts
          src/achievement
          src/pages/Typing/components/Setting/DataSetting.tsx
          --ext .ts,.tsx

      - name: Build Qwerty
        run: yarn build

      - name: Persist complete Cloud Sync Gate result as commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_RESULT: ${{ job.status }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$JOB_RESULT" = 'success' ]; then
            STATE=success
            DESCRIPTION='Cloud backend, lint and build PASS'
          else
            STATE=failure
            DESCRIPTION='Cloud Sync Gate failed or incomplete'
          fi
          export STATE DESCRIPTION
          python3 - <<'PY' > /tmp/cloud-sync-status.json
          import json, os
          print(json.dumps({
            'state': os.environ['STATE'],
            'context': 'p4b/cloud-sync-gate',
            'description': os.environ['DESCRIPTION'],
            'target_url': 'https://github.com/' + os.environ['REPOSITORY'] +
                          '/actions/runs/' + os.environ['RUN_ID'],
          }))
          PY
          curl --fail --silent --show-error --retry 2 -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/cloud-sync-status.json \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${SHA}" > /dev/null

  staging-pilot-readiness:
    name: Exact-SHA Pages + Cloud Staging Admission
    needs: [cloud-backend]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUD_GATE_JOB_PASSED: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Check live Pages regression and latest main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-etest-entry.mjs
