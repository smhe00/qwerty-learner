name: Cloud Sync Gate

on:
  push:
    branches:
      - product/main
    paths:
      - 'cloud-functions/**'
      - 'tests/cloud/**'
      - 'src/sync/**'
      - 'src/utils/backup.ts'
      - 'src/utils/db/index.ts'
      - 'src/utils/db/data-export.ts'
      - 'src/achievement/**'
      - 'src/pages/Typing/components/Setting/DataSetting.tsx'
      - 'docs/CLOUD_SYNC_*.md'
      - 'edgeone.json'
      - '.env.example'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/cloud-sync.yml'
  workflow_dispatch:

concurrency:
  group: cloud-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-backend:
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run cloud backend contract tests
        run: yarn test:cloud

      - name: Lint cloud sync code
        run: yarn eslint cloud-functions tests/cloud --ext .js,.mjs

      - name: Lint frontend sync code
        run: >
          yarn eslint
          src/sync
          src/utils/backup.ts
          src/utils/db/index.ts
          src/utils/db/data-export.ts
          src/achievement
          src/pages/Typing/components/Setting/DataSetting.tsx
          --ext .ts,.tsx

      - name: Build Qwerty
        run: yarn build

      - name: Persist complete Cloud Sync Gate result as commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_RESULT: ${{ job.status }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$JOB_RESULT" = 'success' ]; then
            STATE=success
            DESCRIPTION='Cloud backend, lint and build PASS'
          else
            STATE=failure
            DESCRIPTION='Cloud Sync Gate failed or incomplete'
          fi
          export STATE DESCRIPTION
          python3 - <<'PY' > /tmp/cloud-sync-status.json
          import json, os
          print(json.dumps({
            'state': os.environ['STATE'],
            'context': 'p4b/cloud-sync-gate',
            'description': os.environ['DESCRIPTION'],
            'target_url': 'https://github.com/' + os.environ['REPOSITORY'] +
                          '/actions/runs/' + os.environ['RUN_ID'],
          }))
          PY
          curl --fail --silent --show-error --retry 2 -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/cloud-sync-status.json \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${SHA}" > /dev/null
