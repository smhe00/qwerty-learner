name: Achievement Gate

on:
  push:
    branches:
      - product/main
    paths:
      - 'src/achievement/**'
      - 'src/learn/mastery.ts'
      - 'src/learn/settlement.ts'
      - 'src/review/repository.ts'
      - 'src/pages/Learn/components/LearnResultScreen.tsx'
      - 'src/pages/Achievements/**'
      - 'src/pages/Typing/components/AchievementsButton/**'
      - 'src/pages/Typing/components/Switcher/**'
      - 'src/index.tsx'
      - 'src/pages/Typing/components/WordPanel/components/Word/index.tsx'
      - 'src/review/learning-context.ts'
      - 'src/resources/achievementCulture/**'
      - 'src/utils/db/**'
      - 'src/utils/backup.ts'
      - 'src/sync/snapshot.ts'
      - 'tests/achievement/**'
      - 'scripts/validate-achievement-culture.mjs'
      - '.github/workflows/achievement-gate.yml'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: achievement-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  achievement:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate achievement culture library
        run: yarn validate:achievement-culture

      - name: Lint achievement runtime
        run: >
          yarn eslint
          src/achievement
          src/learn/mastery.ts
          src/learn/settlement.ts
          src/review/repository.ts
          src/resources/achievementCulture
          src/pages/Learn/components/LearnResultScreen.tsx
          src/pages/Achievements
          src/pages/Typing/components/AchievementsButton
          src/pages/Typing/components/Switcher
          src/index.tsx
          src/pages/Typing/components/WordPanel/components/Word/index.tsx
          src/review/learning-context.ts
          src/utils/db/index.ts
          src/utils/db/record.ts
          src/utils/db/review-record.ts
          src/utils/backup.ts
          src/sync/snapshot.ts
          --ext .ts,.tsx

      - name: Bundle achievement domain tests
        run: |
          mkdir -p .achievement-test
          npx esbuild tests/achievement/domain.test.ts tests/achievement/formal-model.test.ts tests/achievement/session.test.ts tests/achievement/mastery.test.ts tests/achievement/event.test.ts --bundle --platform=node --target=node20 --format=esm --outdir=.achievement-test --out-extension:.js=.mjs

      - name: Run achievement domain tests
        run: node --test .achievement-test/domain.test.mjs

      - name: Run achievement formal model
        run: node --test .achievement-test/formal-model.test.mjs

      - name: Run achievement session tests
        run: node --test .achievement-test/session.test.mjs

      - name: Run Learn mastery contract tests
        run: node --test .achievement-test/mastery.test.mjs

      - name: Run achievement behavior-event tests
        run: node --test .achievement-test/event.test.mjs

      - name: Build Qwerty Plus
        run: yarn build
