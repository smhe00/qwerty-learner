name: Pinned release login recovery diagnostic
on:
  push:
    branches: [codex/learn-release-diagnosis-20261026]
    paths:
      - tests/e2e/etest-learn-completion.spec.ts
      - .github/workflows/release-login-diagnostic.yml
permissions:
  contents: read
concurrency:
  group: pinned-release-login-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      QWERTY_LOGIN_LATENCY_DIAGNOSTIC: 'true'
      EXPECTED_DEPLOYED_SHA: e48f3d11e9dc0ec3b8e6c8e781c6691890dc41ac
      QWERTY_SYNC_BASE_URL: https://t.smhe.cn/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - name: Require unchanged deployed source before disposable account
        env:
          EXPECTED_SHA: e48f3d11e9dc0ec3b8e6c8e781c6691890dc41ac
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          const expected = process.env.EXPECTED_DEPLOYED_SHA
          assert.match(expected, /^[a-f0-9]{40}$/)
          const response = await fetch('https://t.smhe.cn/source-commit.txt?diagnostic=' + expected + '-' + Date.now(), {cache: 'no-store', signal: AbortSignal.timeout(15000)})
          assert.equal(response.status, 200)
          const actual = (await response.text()).trim()
          assert.match(actual, /^[a-f0-9]{7,40}$/)
          assert.ok(expected.startsWith(actual), 'Pinned diagnostic runtime changed; stop before account creation')
          console.log(JSON.stringify({diagnosticOnly:true,harness:process.env.GITHUB_SHA,runtime:actual}))
          NODE
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: One diagnostic account, no network mocks or ambiguous replay
        run: GITHUB_REF_NAME=edgeone-test GITHUB_SHA="$EXPECTED_DEPLOYED_SHA" npx playwright test --config=tests/e2e/etest-learn-completion.config.ts --grep '\(complete\)' --timeout=480000
      - name: Preserve redacted failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-login-diagnostic
          path: test-results/**/*-redacted-trace.json
          if-no-files-found: ignore
          retention-days: 7
