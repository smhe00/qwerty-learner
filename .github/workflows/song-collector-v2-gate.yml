name: Song Collector V2 Gate

on:
  push:
    branches:
      - product/main
      - feat/song-collector-v2
      - fix/song-collector-dark-rarity-and-lock-mist
      - fix/song-collector-auto-grid-20261017
      - feat/song-achievement-art-batch1-20261017
      - feat/achievement-34-cards-art-batch2-20261017
      - feat/song-achievement-art-batch3-8-20261017
      - feat/song-complete-34-showcase-final-six-20261017
      - fix/song-visual-four-tiers-and-native-plaques-20261018
    paths:
      - 'src/pages/Achievements/**'
      - 'tests/song-collector-v2/**'
      - 'src/components/NavigationOverlay.tsx'
      - 'public/assets/achievements/song/gallery/**'
      - 'public/assets/achievements/song/first-batch/**'
      - 'public/assets/achievements/song/second-batch/**'
      - 'public/assets/achievements/song/third-batch/**'
      - 'public/assets/achievements/song/final-batch/**'
      - 'public/assets/achievements/song/plaques/**'
      - 'src/song-complete/**'
      - 'preview/song-complete/**'
      - 'vite.config.ts'
      - 'src/achievement/visual-assets/firstBatch.ts'
      - 'src/achievement/visual-assets/secondBatch.ts'
      - 'src/achievement/visual-assets/thirdBatch.ts'
      - 'src/achievement/visual-assets/finalBatch.ts'
      - 'src/achievement/visual-assets/visualTiers.ts'
      - 'src/achievement/visual-assets/SongPlaqueLabel.tsx'
      - 'docs/design/achievement-song-collection/assets/First-Batch-20261017.json'
      - 'docs/design/achievement-song-collection/assets/Second-Batch-20261017.json'
      - 'docs/design/achievement-song-collection/assets/Third-Batch-20261017.json'
      - 'docs/design/achievement-song-collection/assets/Final-Six-20261017.json'
      - 'docs/design/achievement-song-collection/assets/Four-Tier-Visual-Contract-20261018.md'
      - 'scripts/validate-song-first-batch-art.mjs'
      - 'scripts/validate-song-second-batch-art.mjs'
      - 'scripts/validate-song-third-batch-art.mjs'
      - 'scripts/validate-song-final-gallery.mjs'
      - '.github/workflows/song-collector-v2-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Validate real achievement catalog
        run: yarn validate:achievement-culture
      - name: Verify ten independent pictures against real rarity and sha256
        run: node scripts/validate-song-first-batch-art.mjs
      - name: Validate second ten independent pictures and catalogue identity
        run: node scripts/validate-song-second-batch-art.mjs
      - name: Validate eight third-batch original illustrations and real rarity
        run: node scripts/validate-song-third-batch-art.mjs
      - name: Verify final six artworks and all 34 unique IDs
        run: node scripts/validate-song-final-gallery.mjs
      - name: Lint changes
        run: yarn eslint src/pages/Achievements src/components/NavigationOverlay.tsx src/achievement/visual-assets/firstBatch.ts src/achievement/visual-assets/secondBatch.ts src/achievement/visual-assets/thirdBatch.ts src/achievement/visual-assets/finalBatch.ts src/achievement/visual-assets/visualTiers.ts src/achievement/visual-assets/SongPlaqueLabel.tsx src/song-complete --ext .ts,.tsx
      - name: Gate changed source TypeScript
        shell: bash
        run: |
          set +e
          yarn tsc --noEmit > "$RUNNER_TEMP/song-collector-tsc.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            if grep -E '^src/(pages/Achievements/|components/NavigationOverlay[.]tsx|achievement/visual-assets/(firstBatch|secondBatch|thirdBatch|finalBatch|visualTiers)[.]ts|achievement/visual-assets/SongPlaqueLabel[.]tsx|song-complete/)' "$RUNNER_TEMP/song-collector-tsc.log"; then
              echo "::error::Song collector TypeScript diagnostics"
              exit 1
            fi
            echo "::warning::Unrelated repository-wide TypeScript baseline errors remain"
          fi
      - name: Verify raster reference artwork WebP and RIFF bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct
          p = Path('public/assets/achievements/song/gallery/sprite.webp')
          b = p.read_bytes()
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP'
          assert struct.unpack('<I', b[4:8])[0] + 8 == len(b)
          assert 5000 < len(b) < 250000
          print('Approved target gallery artwork bytes:', len(b))
          PY
      - name: Build product app
        run: yarn build
      - name: Verify standalone all-unlocked museum HTML in actual production build
        run: |
          test -f build/preview/song-complete/index.html
          grep -q 'assets/' build/preview/song-complete/index.html
      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium
      - name: Verify portrait layout in real Chromium
        shell: bash
        run: |
          yarn vite preview --host 127.0.0.1 --port 4321 > "$RUNNER_TEMP/song-vite.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/song-collector-v2/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: song-collector-layout-screenshots
          path: tests/song-collector-v2/artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
