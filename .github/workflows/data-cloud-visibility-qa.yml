name: Data Cloud Visibility Regression (No Maker Deploy)

on:
  push:
    branches: [fix/data-cloud-visibility-20261015]

permissions:
  contents: read

jobs:
  data-visibility:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Lint modified data settings
        run: yarn eslint src/pages/Typing/components/Setting/DataSetting.tsx
      - name: Build frontend without deploying
        run: yarn build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Anonymous and authenticated S1 Data visibility E2E
        run: npx playwright test --config=tests/e2e/data-cloud-visibility.config.ts --project=chromium --workers=1 --retries=0 --reporter=list
