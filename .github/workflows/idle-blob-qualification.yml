name: Idle cleanup isolated real Blob qualification

# Existing CI credential remains inside the runner. No Maker deployments,
# account API calls, production store access or runtime configuration changes.
on:
  push:
    branches: [product/main]
    paths:
      - '.github/workflows/idle-blob-qualification.yml'
      - 'scripts/idle-qualification-discovery.mjs'
      - 'scripts/idle-blob-qualification*.mjs'
      - 'tests/cloud/idle-qualification-scope.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-idle-blob-qualification
  cancel-in-progress: false

jobs:
  scope-contract:
    if: github.ref_name == 'product/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Qualify namespace, cleanup and fault-injection runner without credentials
        run: node --test tests/cloud/idle-qualification-scope.test.mjs

  discover-staging:
    needs: [scope-contract]
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    outputs:
      project_id: ${{ steps.discover.outputs.project_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - name: Install pinned official Makers SDK without lifecycle scripts
        run: npm install --no-save --ignore-scripts --prefix "$RUNNER_TEMP/idle-makers-sdk" @edgeone/makers-sdk@0.1.0
      - name: Read-only exact staging binding discovery
        id: discover
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          IDLE_MAKERS_SDK_DIR: ${{ runner.temp }}/idle-makers-sdk
          IDLE_DISCOVERY_REPORT: ${{ runner.temp }}/idle-discovery-redacted.json
        run: node scripts/idle-qualification-discovery.mjs
      - name: Retain redacted discovery result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idle-staging-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/idle-discovery-redacted.json
          if-no-files-found: ignore
          retention-days: 7

  real-blob-lifecycle:
    needs: [discover-staging]
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Run actual idle code on isolated staging Blob fixtures
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          IDLE_QUALIFICATION_PROJECT_ID: ${{ needs.discover-staging.outputs.project_id }}
          IDLE_QUALIFICATION_PROJECT_VERIFIED: EXACT_ETEST_DOMAIN
          IDLE_QUALIFICATION_ACK: RUN_ISOLATED_IDLE_LIFECYCLE
          IDLE_QUALIFICATION_OUTPUT: ${{ runner.temp }}/idle-blob-qualification
        run: node scripts/idle-blob-qualification.mjs
      - name: Retain redacted result and synthetic-only recovery ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idle-real-blob-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/idle-blob-qualification/*.json
          if-no-files-found: ignore
          retention-days: 7
