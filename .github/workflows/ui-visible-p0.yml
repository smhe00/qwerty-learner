name: User-visible UI P0 Gate

on:
  pull_request:
    branches: [product/main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  visible-ui:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        deployment: [pages, edgeone]
    env:
      REACT_APP_DEPLOY_ENV: ${{ matrix.deployment }}
      VITE_QWERTY_SYNC_DISABLED: ${{ matrix.deployment == 'pages' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Validate lossless dictionary content and regeneration
        run: |
          node --test tests/dictionary/*.test.mjs
          node scripts/structure-shanghai-dictionary.mjs
      - name: Lint dictionary presentation
        run: yarn eslint src/components/DictionaryContent src/utils/dictionaryContent.ts src/typings/index.ts src/pages/Typing/components/WordPanel/components/Translation/index.tsx src/pages/Typing/components/WordList/WordCard.tsx --ext .ts,.tsx
      - name: Install Chromium and Chinese fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Build shipped production UI and validate global CSS ownership
        run: yarn build && yarn verify:ui-css
      - name: Verify dictionary content, short-phone actions and cold masks
        run: yarn playwright test --config=tests/e2e/dictionary-content.config.ts --retries=0
      - name: Audit phone, tablet and desktop in both themes
        run: yarn test:ui-visible
      - name: Verify primary learning actions, refresh and audio recovery
        run: yarn playwright test --config=tests/e2e/tablet-refresh-built.config.ts --project=chromium --retries=0
      - name: Verify Pages account UI and zero authentication requests
        if: matrix.deployment == 'pages'
        run: yarn playwright test --config=tests/e2e/mobile-account-pages.config.ts
      - name: Retain per-state audit reports, screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visible-ui-p0-${{ matrix.deployment }}-${{ github.run_id }}
          path: test-results/
          retention-days: 7
