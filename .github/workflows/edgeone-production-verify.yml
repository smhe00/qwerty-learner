name: EdgeOne Production Verify

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edgeone-production-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-22.04
    timeout-minutes: 16
    steps:
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.3'

      - name: Verify actual q.smhe.cn release SHA, gateway and mobile routes
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          const expected = process.env.EXPECTED_RELEASE_SHA
          assert.match(expected || '', /^[a-f0-9]{40}$/)
          const production = 'https://q.smhe.cn'
          const until = Date.now() + 12 * 60 * 1000
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms))
          let last = 'not checked'
          while (Date.now() < until) {
            try {
              const markerUrl = new URL('/source-commit.txt', production)
              markerUrl.searchParams.set('release_probe', expected + '-' + Date.now())
              const response = await fetch(markerUrl, {
                cache: 'no-store',
                signal: AbortSignal.timeout(15_000),
                headers: { 'cache-control': 'no-cache' },
              })
              assert.equal(response.status, 200, 'Source marker HTTP ' + response.status)
              const marker = (await response.text()).trim()
              assert.match(marker, /^[a-f0-9]{7,40}$/, 'Invalid deployment source marker')
              assert.ok(expected.startsWith(marker), 'Stale production build ' + marker)

              const healthUrl = new URL('/api/health', production)
              healthUrl.searchParams.set('release_probe', Date.now().toString())
              const healthResponse = await fetch(healthUrl, {
                cache: 'no-store',
                signal: AbortSignal.timeout(15_000),
              })
              assert.equal(healthResponse.status, 200, 'Gateway health HTTP ' + healthResponse.status)
              const health = await healthResponse.json()
              assert.ok(health.ok && health.service === 'qwerty-sync-gateway',
                'Gateway identity/health mismatch')
              assert.ok(Array.isArray(health.capabilities) &&
                health.capabilities.includes('blob-transient-retry-v1'),
                'Required blob gateway capability missing')
              // Anonymous read-only route probes: no auth, storage or learning.
              const routes = ['/mobile', '/mobile/history', '/mobile/data', '/mobile/achievements']
              for (const path of routes) {
                const target = new URL(path, production)
                target.searchParams.set('release_probe', expected + '-' + Date.now())
                const route = await fetch(target, {
                  cache: 'no-store', signal: AbortSignal.timeout(15_000),
                })
                assert.equal(new URL(route.url).origin, production, 'Unexpected route origin')
                assert.equal(new URL(route.url).pathname.replace(/\/$/, ''), path,
                  'Mobile route redirected away from its entry')
                assert.equal(route.status, 200, 'Mobile route HTTP ' + route.status + ': ' + path)
                const html = await route.text()
                assert.match(html, /id=["']root["']/, 'Missing application entry: ' + path)
              }
              console.log(JSON.stringify({
                result: 'PASS', production, expected, deployed: marker,
                gateway: health.service, apiVersion: health.apiVersion,
                mobileRouteEntries: routes, verificationMode: 'anonymous-read-only',
              }, null, 2))
              process.exit(0)
            } catch (error) {
              last = error instanceof Error ? error.message : String(error)
              console.log('Waiting for the exact production SHA/health:', last)
              await sleep(10_000)
            }
          }
          throw new Error('Production verification timed out: ' + last)
          NODE
