name: Focus UI P1 branch check

on:
  push:
    branches:
      - design/focus-ui-p1-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - name: Install pinned dependencies
        run: yarn install --frozen-lockfile
      - name: Lint changed UI source
        run: >
          yarn eslint
          src/pages/Typing/components/WordPanel/index.tsx
          src/pages/Typing/components/WordPanel/components/Word/index.tsx
          src/pages/Typing/components/WordPanel/components/ExampleCue/index.tsx
          src/pages/Typing/components/WordPanel/components/Translation/index.tsx
          src/pages/Typing/components/WordPanel/components/Phonetic/index.tsx
          src/pages/Learn/components/LearnResultScreen.tsx
      - name: Production build
        run: yarn build
      - name: Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Prepare screenshots
        run: mkdir -p test-results/focus-ui test-results/focus-p1
      - name: Focus P1 and prior P0 Playwright
        run: >
          npx playwright test
          --config=tests/e2e/review-flow.config.ts
          --project=chrome
          tests/e2e/focus-p1-journey.spec.ts
          tests/e2e/focus-p0-final-acceptance.spec.ts
          tests/e2e/focus-ui.spec.ts
      - name: Mode navigation and dialog regressions
        run: >
          npx playwright test
          --config=tests/e2e/review-flow.config.ts
          --project=chrome
          tests/e2e/default-learn-header.spec.ts
          tests/e2e/navigation-dialogs.spec.ts
      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focus-p1-evidence
          path: |
            test-results/focus-p1/*.png
            test-results/focus-ui/*.png
          retention-days: 10
          if-no-files-found: warn
