name: TLA Scale Exploration (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale-3x4:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download pinned TLC
        run: |
          curl -fLsS https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar -o /tmp/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/tla2tools.jar" | sha256sum -c -
      - name: Explore bounded 3-device 4-username state space
        run: |
          java -XX:+UseParallelGC -cp /tmp/tla2tools.jar tlc2.TLC \
            -workers auto \
            -config formal/sync/CloudSyncV2.three-device-four-username.cfg \
            formal/sync/CloudSyncV2.tla
