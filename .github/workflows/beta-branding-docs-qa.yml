name: Beta Public Copy, README and UI Gate (No Maker)
on:
  push:
    branches: [release/beta-branding-docs-20261015]
    paths:
      - '.github/workflows/beta-branding-docs-qa.yml'
permissions:
  contents: read
jobs:
  beta-copy-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: No Alpha customer-facing source strings and accurate Beta documentation
        run: node scripts/check-beta-branding.mjs
      - name: Lint modified live UI
        run: yarn eslint src/components/DonateCard/index.tsx src/pages/Typing/components/ResultScreen/AuthorButton.tsx src/pages/Typing/components/ResultScreen/index.tsx src/pages/Typing/components/ShareButton/SharePicDialog.tsx src/pages/FriendLinks/index.tsx src/pages/Gallery-N/DictRequest.tsx src/utils/trackEvent.ts src/utils/mixpanel.ts
      - name: Build Beta release candidate without Maker deployment
        run: yarn build

  beta-branding-browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Live page title metadata footer donation and mobile Beta E2E
        run: npx playwright test tests/e2e/beta-rc-branding.spec.ts --config=tests/e2e/beta-rc-ui.config.ts --project=chromium --workers=1 --retries=0 --reporter=list
