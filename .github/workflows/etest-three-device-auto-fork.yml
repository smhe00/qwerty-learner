name: etest Single-Session Three-Device Offline Relay E2E
# Only staging. Sequential login, 3 offline branches, automatic V4 reconciliation after reauth.
on:
  push:
    branches: [edgeone-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etest-three-device-fork-${{ github.ref }}
  cancel-in-progress: false

jobs:
  three-real-learn-devices:
    if: github.ref_name == 'edgeone-test'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      QWERTY_SYNC_BASE_URL: https://t.smhe.cn/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - name: Verify actual deployed etest source SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EDGEONE_WAIT_MS: '600000'
        run: node scripts/verify-edgeone-source.mjs
      - name: Verify exact single-session backend before account creation
        run: node tests/cloud/etest-m1m3-pilot-preflight.mjs
      - name: Install browser
        run: |
          yarn install --frozen-lockfile
          npx playwright install --with-deps chromium
      - name: Three real Learn profiles offline fork, reauth and auto reconcile
        run: npx playwright test --config=tests/e2e/etest-three-device-auto-fork.config.ts
      - name: Retain redacted failure evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etest-3way-auto-fork-${{ github.run_id }}
          path: test-results/**/*-redacted-trace.json
          if-no-files-found: ignore
          retention-days: 7
