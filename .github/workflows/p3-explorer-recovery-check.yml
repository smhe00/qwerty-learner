name: P3 and Explorer Recovery Branch

on:
  push:
    branches: [fix/p3-explorer-gates-20261012]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p3-local:
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: P3 real Dexie V6 persistence and terminal mutation cases
        env:
          P3_FUZZ_SEEDS: '20'
          P3_FUZZ_STEPS: '5'
        run: npx playwright test --config=tests/e2e/browser-stateful-fuzz.config.ts --project=chrome
      - name: Upload browser trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p3-recovery-traces
          path: test-results/**/*.zip
          if-no-files-found: warn
  explorer:
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Read actual published Pages version
        shell: bash
        run: |
          set -euo pipefail
          published=$(curl --connect-timeout 5 --max-time 20 -fsSL 'https://smhe00.github.io/qwerty-learner/source-commit.txt')
          test "${#published}" -eq 40
          echo "PAGES_SOURCE_SHA=$published" >> "$GITHUB_ENV"
      - name: Test both current published sites anonymously (no cloud writes)
        run: npx playwright test tests/e2e/published-dual-site-explorer.spec.ts --project=chromium --retries=0 --workers=1
      - name: Redacted numeric route evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-recovery-redacted
          path: |
            test-results/**/*-learn-checkpoints.json
            test-results/**/*-route-explorer-*.json
          if-no-files-found: ignore
