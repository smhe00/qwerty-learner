name: Learn terminal probe branch check

on:
  push:
    branches:
      - feature/learn-daily-frozen-terminal-probe-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - name: Install pinned dependencies
        run: yarn install --frozen-lockfile
      - name: Lint edited production source
        run: >
          yarn eslint
          src/learn/acquisition.ts
          src/learn/admission.ts
          src/learn/controller.ts
          src/learn/daily-session.ts
          src/learn/progression.ts
          src/learn/session.ts
          src/learn/settlement.ts
          src/pages/Learn/components/LearnResultScreen.tsx
          src/review/fsrs/active.ts
          src/utils/db/review-record.ts
      - name: Bundle targeted Learn contracts
        run: |
          mkdir -p .branch-tests
          npx esbuild tests/learn/acquisition-incident.test.ts tests/learn/daily-session.test.ts \
            --bundle --platform=node --target=node20 --format=esm \
            --outdir=.branch-tests --out-extension:.js=.mjs
      - name: Run targeted Learn contracts
        run: node --test .branch-tests/learn/*.test.mjs
      - name: Verify production build
        run: yarn build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Learn acquisition browser regression
        run: npx playwright test --config=tests/e2e/review-flow.config.ts --project=chrome tests/e2e/learn-acquisition-flow.spec.ts
