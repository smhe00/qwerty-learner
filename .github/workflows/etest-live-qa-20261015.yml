name: Etest Live Anonymous Explorer QA (one-off)

on:
  push:
    branches: [qa/etest-e2e-audit-20261015]

permissions:
  contents: read

concurrency:
  group: etest-live-qa-20261015
  cancel-in-progress: false

jobs:
  etest-browser-real-site:
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - name: Ensure deployed site matches audited etest source
        env:
          QWERTY_SYNC_BASE_URL: https://etest.edgeone.dev/
          EXPECTED_SHA: 59e467f40b8edd3fef7043af9f258554e2183b7e
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          assert.equal(new URL(process.env.QWERTY_SYNC_BASE_URL).origin, 'https://etest.edgeone.dev')
          const r = await fetch('https://etest.edgeone.dev/source-commit.txt', {cache:'no-store', signal:AbortSignal.timeout(15000)})
          assert.equal(r.status, 200, 'etest source marker missing')
          const marker = (await r.text()).trim()
          assert.match(marker, /^[a-f0-9]{7,40}$/)
          assert.ok(process.env.EXPECTED_SHA.startsWith(marker), 'etest source differs from audited 59e467f')
          console.log('PASS etest live frontend source', marker)
          NODE
      - name: Install Playwright Chromium
        run: |
          yarn install --frozen-lockfile
          npx playwright install --with-deps chromium
      - name: Run anonymous live-site UX, Learn durability, Typing, mobile, seeded Explorer
        run: |
          npx playwright test tests/e2e/etest-live-explorer.spec.ts \
            --project=chromium --workers=1 --retries=0 --reporter=list
      - name: Upload redacted anonymous checkpoints only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etest-anonymous-e2e-${{ github.run_id }}
          path: |
            test-results/**/*-learn-checkpoints.json
            test-results/**/*-route-explorer-*.json
          if-no-files-found: ignore
          retention-days: 7
