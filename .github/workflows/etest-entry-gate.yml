name: Etest Pilot Admission (read-only)

on:
  push:
    branches: [product/main]
    paths:
      - 'src/sync/**'
      - 'index.html'
      - 'public/404.html'
      - 'scripts/emit-edgeone-spa-entries.mjs'
      - 'cloud-functions/**'
      - 'tests/cloud/**'
      - 'tests/e2e/etest-login-v4-history.*'
      - 'tests/e2e/pages-regression.spec.ts'
      - '.github/workflows/etest-entry-gate.yml'
      - 'scripts/verify-etest-entry.mjs'
      - 'scripts/wait-pages-deployment.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: etest-entry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify matching Cloud Gate, published Pages and full source SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-etest-entry.mjs
