name: P4b Named Test Accounts Real Maker V4 Acceptance

on:
  push:
    branches: [master]
    paths:
      - 'tests/cloud/p4b-edgeone-named-accounts.integration.mjs'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  named-live-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - name: V4 live EdgeOne Maker with ephemeral test13/test24
        id: live
        env:
          QWERTY_SYNC_BASE_URL: https://qwerty-plus.edgeone.dev/
        run: node tests/cloud/p4b-edgeone-named-accounts.integration.mjs
      - name: Record checkable result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ steps.live.outcome }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$RESULT" = success ]; then
            STATE=success
            DESCRIPTION='EdgeOne V4 test13/test24 real protocol PASS, cleaned'
          else
            STATE=failure
            DESCRIPTION='EdgeOne V4 test13/test24 protocol incomplete'
          fi
          export STATE DESCRIPTION
          python3 - <<'PY' > /tmp/p4b-named-status.json
          import json, os
          print(json.dumps({
            'state': os.environ['STATE'],
            'context': 'p4b/edgeone-named-v4',
            'description': os.environ['DESCRIPTION'],
            'target_url': 'https://github.com/' + os.environ['REPOSITORY'] +
                          '/actions/runs/' + os.environ['RUN_ID'],
          }))
          PY
          curl --fail --silent --show-error --retry 2 -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/p4b-named-status.json \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${SHA}" > /dev/null
