name: Focus UI P2 branch check

on:
  push:
    branches:
      - design/focus-ui-p2-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - name: Install pinned dependencies
        run: yarn install --frozen-lockfile
      - name: Lint touched UI components
        run: >
          yarn eslint
          src/components/Layout.tsx
          src/pages/Typing/components/WordPanel/components/Word/index.tsx
          src/pages/Learn/components/LearnLiveStats/index.tsx
          src/pages/Learn/components/LearnResultScreen.tsx
      - name: Build production
        run: yarn build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare images
        run: mkdir -p test-results/focus-p2 test-results/focus-p1 test-results/focus-ui
      - name: Focus P2/P1/P0 real browser regression
        run: >
          npx playwright test
          --config=tests/e2e/review-flow.config.ts
          --project=chrome
          tests/e2e/focus-p2-accessibility.spec.ts
          tests/e2e/focus-p1-journey.spec.ts
          tests/e2e/focus-p0-final-acceptance.spec.ts
          tests/e2e/focus-ui.spec.ts
      - name: Save screenshot evidence
        run: |
          mkdir -p focus-evidence
          find . -type f -name '*.png' -not -path './node_modules/*' |
            grep -E '/(focus-p2|focus-p1|focus-ui)/' |
            while read -r file; do cp "$file" focus-evidence/; done
          test -n "$(find focus-evidence -maxdepth 1 -name '*.png' -print -quit)"
      - name: Existing mode and navigation tests
        run: >
          npx playwright test
          --config=tests/e2e/review-flow.config.ts
          --project=chrome
          tests/e2e/default-learn-header.spec.ts
          tests/e2e/navigation-dialogs.spec.ts
      - name: Upload reviewable screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focus-p2-evidence
          path: focus-evidence/*.png
          retention-days: 10
          if-no-files-found: warn
