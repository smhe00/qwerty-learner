name: Review Final Contracts Branch Check
on:
  push:
    branches: [fix/review-final-learn-contracts-20261012]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remaining-four:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Run four previously red Learn contracts on real app
        run: |
          npx playwright test --config=tests/e2e/review-flow.config.ts --project=chrome \
            tests/e2e/learn-acquisition-flow.spec.ts \
            tests/e2e/learn-block-size.spec.ts \
            tests/e2e/learn-recovery-flow.spec.ts \
            --grep 'five-word short-spacing tail|memory setting persists|finished Learn session rejects duplicate evidence'
      - name: Full Learn browser contract suite (not just the four cases)
        run: npx playwright test --config=tests/e2e/review-flow.config.ts --project=chrome
      - name: Browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-four-traces
          path: test-results/**/*.zip
          if-no-files-found: ignore
