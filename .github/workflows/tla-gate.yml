name: TLA Gate

on:
  push:
    branches:
      - product/main
    paths:
      - 'formal/**'
      - 'tests/formal/**'
      - 'src/learn/trace-ir.ts'
      - 'tests/simulation/system-oracle.ts'
      - '.github/workflows/tla-gate.yml'
  workflow_dispatch:

jobs:
  tla:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: 'yarn'

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download pinned TLA+ tools
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar \
            --output /tmp/tla2tools.jar
          actual="$(sha256sum /tmp/tla2tools.jar | awk '{print $1}')"
          echo "Downloaded tla2tools.jar SHA256: $actual"
          # v1.7.4 is the immutable stable release. Do not use the v1.8.0
          # prerelease alias here: upstream intentionally replaces that asset.
          expected='936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88'
          if [ "$actual" != "$expected" ]; then
            echo "Pinned SHA256 mismatch."
            exit 1
          fi

      - name: Parse Learn TLA model
        run: |
          java -cp /tmp/tla2tools.jar tla2sany.SANY \
            formal/learn/LearnSystem.tla

      - name: Model-check production quota accounting
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config formal/learn/LearnSystem.production.cfg \
            formal/learn/LearnSystem.tla

      - name: Parse deferred liveness model
        run: |
          java -cp /tmp/tla2tools.jar tla2sany.SANY \
            formal/learn/DeferredLifecycle.tla

      - name: Model-check deferred production liveness
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config formal/learn/DeferredLifecycle.production.cfg \
            formal/learn/DeferredLifecycle.tla

      - name: Parse due-first priority model
        run: |
          java -cp /tmp/tla2tools.jar tla2sany.SANY \
            formal/learn/DuePriority.tla

      - name: Model-check due-first production priority
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config formal/learn/DuePriority.production.cfg \
            formal/learn/DuePriority.tla

      - name: Parse checkpoint monotonicity model
        run: |
          java -cp /tmp/tla2tools.jar tla2sany.SANY \
            formal/learn/CheckpointMonotonicity.tla

      - name: Model-check checkpoint production restore
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config formal/learn/CheckpointMonotonicity.production.cfg \
            formal/learn/CheckpointMonotonicity.tla

      - name: Parse progress semantics model
        run: |
          java -cp /tmp/tla2tools.jar tla2sany.SANY \
            formal/learn/ProgressSemantics.tla

      - name: Model-check production progress semantics
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config formal/learn/ProgressSemantics.production.cfg \
            formal/learn/ProgressSemantics.tla

      - name: Parse projection consistency model
        run: |
          java -cp /tmp/tla2tools.jar tla2sany.SANY \
            formal/learn/ProjectionConsistency.tla

      - name: Model-check production projection consistency
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config formal/learn/ProjectionConsistency.production.cfg \
            formal/learn/ProjectionConsistency.tla

      - name: Parse F6 candidate lifecycle model
        run: |
          java -cp /tmp/tla2tools.jar tla2sany.SANY \
            formal/learn/CandidateLifecycle.tla

      - name: Model-check F6 production candidate lifecycle
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config formal/learn/CandidateLifecycle.production.cfg \
            formal/learn/CandidateLifecycle.tla

      - name: Parse F7 session arbitration model
        run: |
          java -cp /tmp/tla2tools.jar tla2sany.SANY \
            formal/learn/SessionArbitration.tla

      - name: Model-check F7 production session arbitration
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config formal/learn/SessionArbitration.production.cfg \
            formal/learn/SessionArbitration.tla

      - name: Parse F8 fresh budget model
        run: |
          java -cp /tmp/tla2tools.jar tla2sany.SANY \
            formal/learn/FreshBudget.tla

      - name: Model-check F8 production fresh budget
        run: |
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config formal/learn/FreshBudget.production.cfg \
            formal/learn/FreshBudget.tla

      - name: Require admitted-based mutation counterexample
        run: |
          set +e
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config formal/learn/LearnSystem.acquired-mutation.cfg \
            formal/learn/LearnSystem.tla \
            > /tmp/acquired-mutation-tlc.log 2>&1
          status=$?
          set -e
          cat /tmp/acquired-mutation-tlc.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected the acquired-based mutation to violate NoRepeatedSingleton.'
            exit 1
          fi

      - name: Require due-first bypass counterexample
        run: |
          set +e
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config formal/learn/DuePriority.bypass-mutation.cfg \
            formal/learn/DuePriority.tla \
            > /tmp/due-first-bypass-tlc.log 2>&1
          status=$?
          set -e
          cat /tmp/due-first-bypass-tlc.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected the due-first bypass mutation to violate NoPureAcquisitionWhenDue.'
            exit 1
          fi

      - name: Require stale checkpoint counterexample
        run: |
          set +e
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config formal/learn/CheckpointMonotonicity.stale-mutation.cfg \
            formal/learn/CheckpointMonotonicity.tla \
            > /tmp/stale-checkpoint-tlc.log 2>&1
          status=$?
          set -e
          cat /tmp/stale-checkpoint-tlc.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected the stale checkpoint mutation to violate RestoreLatestCheckpoint.'
            exit 1
          fi

      - name: Require silent progress counterexample
        run: |
          set +e
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config formal/learn/ProgressSemantics.silent-noop.cfg \
            formal/learn/ProgressSemantics.tla \
            > /tmp/silent-progress-tlc.log 2>&1
          status=$?
          set -e
          cat /tmp/silent-progress-tlc.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected the silent progress mutation to violate SuccessfulAttemptHasEffect.'
            exit 1
          fi

      - name: Require dropped projection counterexample
        run: |
          set +e
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config formal/learn/ProjectionConsistency.drop-mutation.cfg \
            formal/learn/ProjectionConsistency.tla \
            > /tmp/dropped-projection-tlc.log 2>&1
          status=$?
          set -e
          cat /tmp/dropped-projection-tlc.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected the dropped projection mutation to violate ProjectionMatches.'
            exit 1
          fi

      - name: Require F6 candidate lifecycle counterexamples
        run: |
          for mutation in pending-as-fresh admitted-as-fresh excluded-selected duplicate-canonical; do
            set +e
            java -cp /tmp/tla2tools.jar tlc2.TLC \
              -config "formal/learn/CandidateLifecycle.${mutation}.cfg" \
              formal/learn/CandidateLifecycle.tla \
              > "/tmp/f6-${mutation}.log" 2>&1
            status=$?
            set -e
            cat "/tmp/f6-${mutation}.log"
            if [ "$status" -eq 0 ]; then
              echo "Expected F6 mutation ${mutation} to violate CandidateLifecycleSound."
              exit 1
            fi
          done

      - name: Require F7 session arbitration counterexamples
        run: |
          for mutation in finished-shadows-unfinished oldest-unfinished wrong-dict waiting-despite-unfinished; do
            set +e
            java -cp /tmp/tla2tools.jar tlc2.TLC \
              -config "formal/learn/SessionArbitration.${mutation}.cfg" \
              formal/learn/SessionArbitration.tla \
              > "/tmp/f7-${mutation}.log" 2>&1
            status=$?
            set -e
            cat "/tmp/f7-${mutation}.log"
            if [ "$status" -eq 0 ]; then
              echo "Expected F7 mutation ${mutation} to violate SessionArbitrationSound."
              exit 1
            fi
          done

      - name: Require F8 fresh budget counterexamples
        run: |
          for mutation in acquired-accounting over-budget ignores-unseen pending-consumes-budget; do
            set +e
            java -cp /tmp/tla2tools.jar tlc2.TLC \
              -config "formal/learn/FreshBudget.${mutation}.cfg" \
              formal/learn/FreshBudget.tla \
              > "/tmp/f8-${mutation}.log" 2>&1
            status=$?
            set -e
            cat "/tmp/f8-${mutation}.log"
            if [ "$status" -eq 0 ]; then
              echo "Expected F8 mutation ${mutation} to violate FreshBudgetSound."
              exit 1
            fi
          done

      - name: Require stranded deferred liveness counterexample
        run: |
          set +e
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config formal/learn/DeferredLifecycle.stranded-mutation.cfg \
            formal/learn/DeferredLifecycle.tla \
            > /tmp/stranded-deferred-tlc.log 2>&1
          status=$?
          set -e
          cat /tmp/stranded-deferred-tlc.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected the stranded deferred mutation to violate DeferredEventuallyResumes.'
            exit 1
          fi

      - name: Bundle live TLC trace checker
        run: |
          mkdir -p .formal-test
          npx esbuild tests/formal/tla-counterexample-check.ts \
            --bundle \
            --platform=node \
            --target=node20 \
            --format=esm \
            --outfile=.formal-test/tla-counterexample-check.mjs

      - name: Replay TLC counterexample through Shared Trace Oracle
        run: |
          node .formal-test/tla-counterexample-check.mjs \
            /tmp/acquired-mutation-tlc.log \
            repeated-singleton-acquisition
          node .formal-test/tla-counterexample-check.mjs \
            /tmp/stranded-deferred-tlc.log \
            stranded-pending-acquisition
          node .formal-test/tla-counterexample-check.mjs \
            /tmp/due-first-bypass-tlc.log \
            due-work-bypassed
          node .formal-test/tla-counterexample-check.mjs \
            /tmp/stale-checkpoint-tlc.log \
            checkpoint-regression
          node .formal-test/tla-counterexample-check.mjs \
            /tmp/silent-progress-tlc.log \
            success-without-progress
          node .formal-test/tla-counterexample-check.mjs \
            /tmp/dropped-projection-tlc.log \
            controller-driver-divergence
          for mutation in pending-as-fresh admitted-as-fresh excluded-selected duplicate-canonical; do
            node .formal-test/tla-counterexample-check.mjs \
              "/tmp/f6-${mutation}.log" \
              candidate-lifecycle-violation
          done
          for mutation in finished-shadows-unfinished oldest-unfinished wrong-dict waiting-despite-unfinished; do
            node .formal-test/tla-counterexample-check.mjs \
              "/tmp/f7-${mutation}.log" \
              session-arbitration-violation
          done
          for mutation in acquired-accounting over-budget ignores-unseen pending-consumes-budget; do
            node .formal-test/tla-counterexample-check.mjs \
              "/tmp/f8-${mutation}.log" \
              fresh-budget-violation
          done
