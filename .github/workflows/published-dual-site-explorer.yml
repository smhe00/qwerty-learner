name: Published Dual-Site Explorer (Pages + EdgeOne)

# Runs on the published URLs only. Never builds or deploys EdgeOne master.
# Anonymous read-only Explorer only. Real Cloud E2E belongs to edgeone-test.
on:
  push:
    branches: [product/main]
    paths:
      - 'src/**'
      - 'tests/e2e/published-dual-site-explorer.spec.ts'
      - '.github/workflows/published-dual-site-explorer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dual-site-browser:
    concurrency:
      group: published-dual-site-browser-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    env:
      PAGES_SOURCE_SHA: ${{ github.sha }}
      QWERTY_SYNC_BASE_URL: https://q.smhe.cn/
      CI: 'true'
    steps:
      - name: Checkout development test harness; do not deploy master
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: yarn
      - name: Verify EdgeOne public health before browser work
        run: node tests/cloud/resolve-production-base.mjs
      - name: Install Playwright Chromium without building either site
        run: |
          yarn install --frozen-lockfile
          npx playwright install --with-deps chromium
      - name: Pin the currently served Pages SHA immediately before real-site tests
        shell: bash
        run: |
          set -euo pipefail
          published=$(curl --connect-timeout 5 --max-time 20 -fsSL \
            'https://smhe00.github.io/qwerty-learner/source-commit.txt')
          if ! [[ "$published" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Published Pages source-commit.txt is missing or malformed"
            exit 1
          fi
          echo "PAGES_SOURCE_SHA=$published" >> "$GITHUB_ENV"
          echo "Test target: actually published Pages SHA ${published:0:12}"
          if [ "$published" != "$GITHUB_SHA" ]; then
            echo "::notice::Pages is at ${published:0:12}, while test harness is ${GITHUB_SHA:0:12}; this gate tests the actually served version, not an unpublished SHA."
          fi
      - name: Run identical anonymous Explorer coverage against both published URLs
        run: >-
          npx playwright test
          tests/e2e/published-dual-site-explorer.spec.ts
          --project=chromium --retries=0 --workers=1
      - name: Persist redacted numeric Explorer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-dual-site-explorer-${{ github.run_id }}
          path: |
            test-results/**/*-learn-checkpoints.json
            test-results/**/*-route-explorer-*.json
          if-no-files-found: ignore
          retention-days: 14

  # Production cloud writes ONLY with disposable accounts. Existing S1
  # verified 3-client scenario performs registration, revoked session,
  # cloud sync, conflict detection, restore and identity isolation.
  # This lane runs once for explicitly marked commits or by manual opt-in.
