<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="keycap" x1="40" y1="28" x2="160" y2="174" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.72" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF3F8"/>
    </linearGradient>

    <linearGradient id="cloud" x1="76" y1="92" x2="124" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9FCBFF"/>
      <stop offset="1" stop-color="#5797E8"/>
    </linearGradient>

    <linearGradient id="review" x1="133" y1="55" x2="162" y2="99" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC85D"/>
      <stop offset="1" stop-color="#F0A11C"/>
    </linearGradient>

    <filter id="keyShadow" x="6" y="6" width="188" height="192" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#7C93AD" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#FFFFFF" flood-opacity="0.9"/>
    </filter>

    <filter id="softInner" x="24" y="18" width="152" height="164" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="0.35"/>
    </filter>
  </defs>

  <!-- soft keycap, tuned for the site's light UI -->
  <g filter="url(#keyShadow)">
    <rect x="24" y="18" width="152" height="156" rx="34" fill="url(#keycap)"/>
    <rect x="24.75" y="18.75" width="150.5" height="154.5" rx="33.25" stroke="#E5EAF0" stroke-width="1.5"/>
  </g>

  <!-- Q: heavier, smoother and optically centered -->
  <circle cx="91" cy="96" r="48" stroke="#334155" stroke-width="17" stroke-linecap="round"/>
  <path d="M121.5 127L150.5 156" stroke="#334155" stroke-width="17" stroke-linecap="round"/>

  <!-- cloud, simplified for small-size legibility -->
  <g>
    <circle cx="88" cy="110" r="15" fill="url(#cloud)"/>
    <circle cx="105" cy="100" r="20" fill="url(#cloud)"/>
    <circle cx="123" cy="111" r="14" fill="url(#cloud)"/>
    <rect x="75" y="108" width="62" height="23" rx="11.5" fill="url(#cloud)"/>
  </g>

  <!-- adaptive-review loop arrow, integrated with the Q arc -->
  <path d="M132 66C141 61 151 60 159 64C168 68 173 77 173 88"
        stroke="url(#review)" stroke-width="10" stroke-linecap="round"/>
  <path d="M160.5 55L176 81L147.5 78L160.5 55Z" fill="#F0A11C"/>
</svg>